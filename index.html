<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>считалОчка</title>
<meta name="theme-color" content="#6a45e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="считалОчка">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one narrow column, wallet on top, tab bar at the bottom, entry form as a bottom sheet. */
:root{
  --bg:#f2f0f7; --surface:#ffffff; --surface2:#e9e6f2; --ink:#1d1830; --muted:#6a6385; --line:#dcd7ea;
  --accent:#6a45e8; --accent-ink:#ffffff; --in:#0d7f58; --out:#cf3f3a; --warn:#a96a0c; --warn-bg:#fbf0d9; --bad-bg:#fbe3e1; --good-bg:#dff3e9; --gold:#d99a1a;
  --font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14111c; --surface:#1e1a29; --surface2:#292335; --ink:#f1ecf9; --muted:#a99bc2; --line:#34293f;
    --accent:#a98bff; --accent-ink:#17102b; --in:#6fdca6; --out:#ff8080; --warn:#f0c674; --warn-bg:#3a2f18; --bad-bg:#3b1f24; --good-bg:#1b3328; --gold:#f0c674; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14111c; --surface:#1e1a29; --surface2:#292335; --ink:#f1ecf9; --muted:#a99bc2; --line:#34293f;
  --accent:#a98bff; --accent-ink:#17102b; --in:#6fdca6; --out:#ff8080; --warn:#f0c674; --warn-bg:#3a2f18; --bad-bg:#3b1f24; --good-bg:#1b3328; --gold:#f0c674; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:0 96px;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:16px}
h1,h2,h3,p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
.ico{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.ico svg{width:20px;height:20px}
.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hero{background:var(--accent);color:var(--accent-ink);gap:6px}
.hero .lbl{font-size:13px;opacity:.8}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.stat{background:rgba(255,255,255,.14);border-radius:12px;padding:10px;min-width:0}
.stat .lbl{font-size:11px;opacity:.85}
.stat b{display:block;font-size:15px;font-weight:700;margin-top:2px;white-space:nowrap}
.note{border-radius:14px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.note b{font-size:14px}
.note.good{background:var(--good-bg)} .note.warn{background:var(--warn-bg)} .note.bad{background:var(--bad-bg)}
.note.info{background:var(--surface);}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted)}
.amt{font-weight:700;white-space:nowrap}
.amt.in{color:var(--in)} .amt.out{color:var(--out)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.list{display:flex;flex-direction:column}
.list .row{padding-block:10px;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.list .row:first-child{border-top:0}
.daytitle{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600;padding:4px 2px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav b{font-size:16px;text-transform:capitalize}
.nav button{width:40px;height:40px;border-radius:12px;background:var(--surface);font-size:18px;color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 16px;font-weight:700}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--out)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.split i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-size:34px;font-weight:800;line-height:1}
.empty{color:var(--muted);font-size:14px;padding-block:8px}
svg text{fill:var(--muted);font-family:var(--font)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--accent)}
.tabs .plus{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);margin:-18px auto 0;display:grid;place-items:center;box-shadow:0 4px 14px rgba(106,69,232,.4)}
.tabs .plus svg{width:26px;height:26px}
.ov{position:fixed;inset:0;background:rgba(10,6,20,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.ov[hidden],[hidden]{display:none!important}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:18px;font-weight:800}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.f input.amount{font-size:26px;font-weight:800}
.f textarea{min-height:70px;resize:vertical;font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-block;background:var(--surface2);border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;color:var(--muted)}
.chip.ok{background:var(--good-bg);color:var(--in)}
.chip.late{background:var(--warn-bg);color:var(--warn)}
.sum3{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:6px 10px;font-size:13px;align-items:center}
.sum3 .h{color:var(--muted);font-size:11.5px;font-weight:600}
.sum3 .r{text-align:right;white-space:nowrap}
.fine{font-size:12.5px;color:var(--muted)}
.bigsum{font-size:30px;font-weight:800;letter-spacing:-.02em}
.card.game{flex-direction:row;align-items:center;text-align:left;width:100%;gap:14px}
.petbox{flex:none;width:72px;height:72px;display:block}
.gi{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.gt{font-weight:700}
.game .bar{display:block}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.stats3 div{display:flex;flex-direction:column;gap:2px}
.stats3 b{font-size:24px;font-weight:800}
.q{display:flex;flex-direction:column;gap:8px;padding-block:10px;border-top:1px solid var(--line)}
.card h2 + .q{border-top:0}
.q.done .t{color:var(--muted);text-decoration:line-through}
.achs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ach{display:flex;flex-direction:column;gap:2px;background:var(--surface2);border-radius:14px;padding:12px;opacity:.55}
.ach.on{opacity:1}
.ach b{font-size:14px;overflow-wrap:anywhere}
.medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--muted);margin-bottom:4px}
.ach.on .medal{background:var(--gold);color:#fff}
.toast{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));max-width:380px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;z-index:20;display:flex;flex-direction:column;gap:2px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast .sub{font-weight:500;font-size:13px}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.toast.show{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}}

:root.cheer body{background-color:var(--bg);background-image:var(--graf);background-size:360px 520px;background-attachment:fixed}
.cheer .hero{background:linear-gradient(135deg,var(--hero1) 0%,var(--hero2) 100%);color:var(--heroink)}
.cheer .hero .lbl,.cheer .hero .fine{color:var(--heroink);opacity:.95}
.cheer .hero .stat{background:rgba(255,255,255,.2)}
.cheer .card{box-shadow:0 2px 0 var(--line)}
.cheer .tabs{background:var(--surface)}

  if(!S.rules.length)return out;
  for(var k=0;k<24&&ym<=end;k++,ym=nextYM(ym,1)){
    var days={};S.rules.forEach(function(r){(days[r.day]=days[r.day]||[]).push(r)});
    Object.keys(days).forEach(function(d){
      var date=planned(ym,+d);if(date>T||date<S.planFrom||ruleSkipped(d,ym))return;
      var rs=days[d].filter(function(r){return !ruleDone(r,ym)&&accById(r.acc)});
      if(rs.length)out.push({day:+d,ym:ym,date:date,rules:rs,sum:rs.reduce(function(a,r){return a+r.amt},0)});
    });
  }
  return out.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
}
function applyPayout(day,ym){
  var date=planned(ym,day),n=0;
  S.rules.filter(function(r){return r.day===day&&!ruleDone(r,ym)&&accById(r.acc)}).forEach(function(r){
    S.entries.push({id:uid(),type:'t',amt:r.amt,cat:'',date:date,note:r.name+' · по плану',cls:'',from:defAcc(),to:r.acc,rule:r.id});n++;
  });
  return n;
}

function bkDays(){if(!S.lastBackup)return null;return diffDays(S.lastBackup,T)}
function realCount(){return S.entries.filter(function(e){return !e.demo}).length}
function backupNote(){

function doDownload(){

    if(navigator.canShare&&window.File){var f=new File([blob],name,{type:'application/json'});if(navigator.canShare({files:[f]})){navigator.share({files:[f]}).then(markBackup,function(){});return 'share'}}

function planStats(){
  var res={};
  S.rules.forEach(function(r){if(!res[r.acc])res[r.acc]={plan:0,fact:0}});
  var ym=planFromYM(),end=T.slice(0,7);
  for(var k=0;k<24&&ym<=end;k++,ym=nextYM(ym,1)){
    S.rules.forEach(function(r){
      var date=planned(ym,r.day);if(date>T||date<S.planFrom||ruleSkipped(r.day,ym)||!res[r.acc])return;
      res[r.acc].plan+=r.amt;if(ruleDone(r,ym))res[r.acc].fact+=r.amt;
    });
  }
  return res;
}
function plannedItems(from,days){
  var out=[],end=iso(addDays(parse(from),days)),ym0=from.slice(0,7);
  [0,1,2].forEach(function(k){
    var ym=nextYM(ym0,k);
    S.recur.forEach(function(r){var d=planned(ym,r.day);if(d>=from&&d<=end&&!doneFor('rid',r.id,ym))out.push({date:d,kind:'out',name:r.name,amt:r.amt,id:r.id,cat:r.cat,ym:ym})});
    S.incomes.forEach(function(r){var d=planned(ym,r.day);if(d>=from&&d<=end&&!doneFor('iid',r.id,ym))out.push({date:d,kind:'in',name:r.name,amt:r.amt,id:r.id,ym:ym})});
    if(S.planFrom)S.rules.forEach(function(r){
      if(!accById(r.acc)||ym<planFromYM()||ruleDone(r,ym)||ruleSkipped(r.day,ym))return;
      var d=planned(ym,r.day);if(d<S.planFrom)return;if(d<from)d=from;
      if(d<=end)out.push({date:d,kind:'out',name:'→ '+r.name,amt:r.amt,id:r.id,ym:ym,rule:1});
    });
  });
  return out.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
}
function offMain(e){var a=e.acc&&accById(e.acc);return !!(a&&a.type!=='main')}
function avgDaily(){
  var from=iso(addDays(parse(T),-13)),s=0;
  S.entries.forEach(function(x){if(x.type==='e'&&!x.rid&&x.date>=from&&x.date<=T)s+=x.amt});
  return s/14;
}
function forecast(){
  var bal=balance(),avg=avgDaily(),ev=plannedItems(T,31);
  for(var i=0;i<=31;i++){
    var d=iso(addDays(parse(T),i));
    if(i>0)bal-=avg;
    ev.forEach(function(e){if(e.date===d&&!offMain(e))bal+=e.kind==='in'?e.amt:-e.amt});
    if(bal<0)return {date:d,avg:avg};
  }
  return {date:null,avg:avg};
}
function perDay(){
  var ev=plannedItems(T,45),nextIn=null;
  for(var i=0;i<ev.length;i++){if(ev[i].kind==='in'&&ev[i].date>T){nextIn=ev[i].date;break}}
  if(!nextIn)nextIn=iso(addDays(parse(T),30));
  var due=0;ev.forEach(function(e){if(e.kind==='out'&&e.date<nextIn&&!offMain(e))due+=e.amt});
  var days=Math.max(1,diffDays(T,nextIn));
  return {val:(balance()-due)/days,days:days,nextIn:nextIn,due:due};
}
function health(ym){
  var ex=monthEntries(ym).filter(function(x){return x.type==='e'});
  var inc=sum(monthEntries(ym),'i'),tot=0,by={need:0,mind:0,imp:0};
  ex.forEach(function(x){tot+=x.amt;by[x.cls||'need']+=x.amt});
  if(!tot)return null;
  var s=100-(by.imp/tot)*60;
  if(inc>0&&tot>inc)s-=Math.min(30,(tot/inc-1)*60);
  s=Math.max(0,Math.min(100,Math.round(s)));
  return {score:s,by:by,tot:tot};
}
function streak(){
  var imp=S.entries.filter(function(x){return x.type==='e'&&x.cls==='imp'&&x.date<=T}).map(function(x){return x.date}).sort();
  if(imp.length)return diffDays(imp[imp.length-1],T);
  var all=S.entries.map(function(x){return x.date}).sort();
  return all.length?diffDays(all[0],T)+1:0;
}

function hsh(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function dayLimit(){var v=+S.dayLimit;return v>0?v:(S.simple?1650:2000)}
function dayCtx(list){
  var c={n:list.length,exp:0,imp:false,plan:false,note:false,cafe:false,dip:false,rule:false,lim:dayLimit()};
  list.forEach(function(x){
    if(x.rid||x.iid||x.rule)c.plan=true;else if(x.note)c.note=true;
    if(x.rule)c.rule=true;
    var fa=x.type==='t'?accById(x.from):(x.type==='e'?accById(x.acc):null);
    if(fa&&fa.type==='save'&&!x.rule)c.dip=true;
    if(x.type==='e'){if(!x.rid)c.exp+=x.amt;if(x.cls==='imp')c.imp=true;if(x.cat==='cafe'||x.cat==='taxi')c.cafe=true}
  });
  return c;
}
function questIds(d){var s=hsh(d)%6;return [s,(s+2)%6,(s+4)%6]}
function game(){
  var by={},first=null;
  S.entries.forEach(function(x){if(x.demo||x.date>T)return;(by[x.date]=by[x.date]||[]).push(x);if(!first||x.date<first)first=x.date});
  var g={xp:0,total:0,okDays:0,streak:0,maxStreak:0,maxClean:0,maxNoDip:0,ruleDays:0,plans:0,cats:{},qdone:0,quests:[],today:null};
  var run=0,clean=0,nodip=0,i,n=first?diffDays(first,T):-1;
  for(i=0;i<=n;i++){
    var d=iso(addDays(parse(first),i)),list=by[d]||[],c=dayCtx(list),isToday=d===T;
    if(list.length){
      run++;g.total+=list.length;g.xp+=10+Math.min(3,list.length-1)*3;
      if(c.exp<=c.lim){g.xp+=20;g.okDays++}
      if(!c.imp){g.xp+=10;clean++}else clean=0;
      if(!c.dip){g.xp+=10;nodip++}else nodip=0;
      if(c.rule){g.xp+=30;g.ruleDays++}
      if(run>=3)g.xp+=5;
      list.forEach(function(x){if(x.rid||x.iid)g.plans++;if(x.type==='e')g.cats[x.cat]=1});
      if(run>g.maxStreak)g.maxStreak=run;if(clean>g.maxClean)g.maxClean=clean;if(nodip>g.maxNoDip)g.maxNoDip=nodip;
    }else if(!isToday){run=0;clean=0;nodip=0}
    questIds(d).forEach(function(qi){
      var q=QUESTS[qi],v=q.val(c),done=v>=q.goal;
      if(done){g.xp+=25;g.qdone++}
      if(isToday)g.quests.push({t:q.t,v:v,goal:q.goal,done:done});
    });
    if(isToday)g.today=c;
  }
  if(!g.today){
    g.today=dayCtx([]);
    questIds(T).forEach(function(qi){var q=QUESTS[qi];g.quests.push({t:q.t,v:0,goal:q.goal,done:false})});
  }
  g.streak=run;
  g.ach=ACH.map(function(a){return {id:a.id,t:a.t,d:a.d,on:!!a.f(g)}});
  g.xp+=50*g.ach.filter(function(a){return a.on}).length;
  g.L=Math.floor(Math.sqrt(g.xp/60))+1;
  g.fl=60*(g.L-1)*(g.L-1);g.nx=60*g.L*g.L;
  g.title=TITLES[Math.min(g.L-1,TITLES.length-1)];
  var t=g.today;
  g.mood=t.n===0?((S.noSpend||[]).indexOf(T)>=0?'happy':'hungry'):(t.exp>t.lim?'sad':'happy');
  return g;
}

  var by={};me.forEach(function(x){(by[x.date]=by[x.date]||[]).push(x)});
  var days=Object.keys(by).sort().reverse();
  var seg='<div class="seg">'+[['all','Все'],['e','Расходы'],['i','Доходы']].map(function(s){return '<button data-a="hf" data-v="'+s[0]+'" class="'+(hf===s[0]?'on':'')+'">'+s[1]+'</button>'}).join('')+'</div>';
  var body=days.length?days.map(function(d){
    var tot=by[d].reduce(function(a,x){return a+(x.type==='e'?-x.amt:x.type==='t'?0:x.amt)},0),dt=parse(d);
    return '<div class="card" style="gap:4px"><div class="daytitle"><span>'+dt.getDate()+' '+MONTHS_G[dt.getMonth()]+', '+WD[dt.getDay()]+'</span><span>'+money(tot)+'</span></div><div class="list">'+by[d].slice().reverse().map(entryRow).join('')+'</div></div>';

/* ---------- разбор месяца ---------- */
var rvCands=[];
function reviewCard(){
  var ym=vym,curYM=T.slice(0,7);if(ym>curYM)return '';
  var cur=ym===curYM,a=ym.split('-'),n=dim(+a[0],+a[1]-1),d=cur?parseInt(T.slice(8),10):n,left=n-d;
  function ex(m,upto){return S.entries.filter(function(x){return x.type==='e'&&!x.skip&&!x.demo&&x.date.slice(0,7)===m&&(!upto||parseInt(x.date.slice(8),10)<=upto)})}
  function tot(l){return l.reduce(function(s,x){return s+x.amt},0)}
  function byCat(l){var o={};l.forEach(function(x){o[x.cat]=(o[x.cat]||0)+x.amt});return o}
  function cname(k){return (CMAP[k]||CMAP.other).name}
  function ccol(k){return (CMAP[k]||CMAP.other).color}
  function pct(x){return Math.round(x*100)+'%'}
  var list=ex(ym),spent=tot(list);
  var prev=[];for(var k=1;k<=6&&prev.length<3;k++){var pm=nextYM(ym,-k);if(ex(pm).length)prev.push(pm)}
  var H='<div class="card"><h2>Разбор месяца</h2>';
  if(!list.length&&!prev.length)return H+'<p class="empty">Появится, когда будут записи трат.</p></div>';
  var big=list.filter(function(x){return x.amt>=3000&&x.amt>=spent*0.15}),bigSum=tot(big);
  var fc=cur&&d>0?spent+((spent-bigSum)/d)*left:spent;
  var base=null,baseTo=null,baseCat={};
  if(prev.length){
    base=prev.reduce(function(s,m){return s+tot(ex(m))},0)/prev.length;
    baseTo=prev.reduce(function(s,m){return s+tot(ex(m,cur?d:0))},0)/prev.length;
    prev.forEach(function(m){var c=byCat(ex(m,cur?d:0));Object.keys(c).forEach(function(kk){baseCat[kk]=(baseCat[kk]||0)+c[kk]/prev.length})});
  }
  var curCat=byCat(list),tips=[];
  /* 1. итог или прогноз */
  var cmp='';
  if(base!==null&&base>0){
    var ref=cur?fc:spent,df=ref-base,rel=df/base;
    cmp=Math.abs(rel)<0.05?'Примерно как обычно ('+money(base)+' в среднем за '+prev.length+' мес.).'
      :(df>0?'На '+money(df)+' больше':'На '+money(-df)+' меньше')+' обычного ('+money(base)+' в среднем за '+prev.length+' мес.), '+(df>0?'+':'−')+pct(Math.abs(rel))+'.';
  }else cmp='Сравнивать пока не с чем: сравнение появится, когда накопится хотя бы один прошлый месяц с записями.';
  H+='<div class="note '+(base&&(cur?fc:spent)>base*1.1?'warn':base&&(cur?fc:spent)<base*0.95?'good':'info')+'"><b>'+(cur?'Прогноз на месяц: около '+money(fc):'Итог месяца: '+money(spent))+'</b><span class="fine">'+
    (cur?'Потрачено '+money(spent)+' за '+d+' дн., осталось '+left+' дн.'+(bigSum?' Крупные разовые траты ('+money(bigSum)+') в прогнозе не повторяются.':'')+' ':'')+cmp+'</span></div>';
  /* 2. категории */
  var keys={};Object.keys(curCat).concat(Object.keys(baseCat)).forEach(function(kk){keys[kk]=1});
  var ch=Object.keys(keys).map(function(kk){var c=curCat[kk]||0,b=baseCat[kk]||0;return {k:kk,c:c,b:b,df:c-b}});
  var up=ch.filter(function(x){return x.df>=1000&&(x.b===0||x.df/x.b>=0.3)}).sort(function(p,q){return q.df-p.df}).slice(0,3);
  var down=ch.filter(function(x){return x.df<=-1000&&x.b>0&&-x.df/x.b>=0.3}).sort(function(p,q){return p.df-q.df}).slice(0,2);
  if(prev.length&&(up.length||down.length)){
    H+='<div class="fine" style="font-weight:700;margin-top:4px">Что изменилось'+(cur?' к '+d+'-му числу':'')+' по сравнению с обычным</div><div class="list">'+
      up.concat(down).map(function(x){return '<div class="row"><span class="dot" style="background:'+ccol(x.k)+'"></span><div class="grow"><div class="t">'+esc(cname(x.k))+'</div><div class="s">'+money(x.c)+' · обычно '+money(x.b)+'</div></div><span class="amt '+(x.df>0?'out':'in')+'">'+(x.df>0?'+':'−')+money(Math.abs(x.df))+'</span></div>'}).join('')+'</div>';
  }
  /* 3. необычные траты */
  var from=iso(addDays(parse(ym+'-01'),-120)),start=ym+'-01';
  var odd=list.filter(function(x){
    var h=S.entries.filter(function(y){return y.type==='e'&&!y.demo&&!y.skip&&y.cat===x.cat&&y.date>=from&&y.date<start}).map(function(y){return y.amt}).sort(function(p,q){return p-q});
    if(h.length>=3){var med=h[Math.floor(h.length/2)];return x.amt>=Math.max(3*med,2000)}
    return x.amt>=Math.max(5000,spent*0.2);
  }).sort(function(p,q){return q.amt-p.amt}).slice(0,3);
  if(odd.length){
    H+='<div class="fine" style="font-weight:700;margin-top:4px">Необычно крупные траты</div><div class="list">'+odd.map(function(x){return '<div class="row"><span class="dot" style="background:'+ccol(x.cat)+'"></span><div class="grow"><div class="t">'+esc(x.note||cname(x.cat))+'</div><div class="s">'+esc(cname(x.cat))+' · '+dlabel(x.date)+'</div></div><span class="amt out">'+money(x.amt)+'</span></div>'}).join('')+'</div>';
  }
  /* 4. регулярные, но не в плане */
  rvCands=[];
  var grp={},months=[ym,nextYM(ym,-1),nextYM(ym,-2),nextYM(ym,-3)];
  S.entries.forEach(function(x){if(x.type!=='e'||x.demo||x.rid||!x.note||months.indexOf(x.date.slice(0,7))<0)return;var kk=norm(x.note);(grp[kk]=grp[kk]||[]).push(x)});
  var planned=(S.recur||[]).map(function(r){return norm(r.name)});
  Object.keys(grp).forEach(function(kk){
    var g=grp[kk],ms={};g.forEach(function(x){ms[x.date.slice(0,7)]=1});
    if(Object.keys(ms).length<2||g.length>Object.keys(ms).length*2)return;
    if(!(ms[ym]||ms[nextYM(ym,-1)]))return;
    if(planned.some(function(p){return p&&(p===kk||kk.indexOf(p)>=0||p.indexOf(kk)>=0)}))return;
    var am=g.map(function(x){return x.amt}).sort(function(p,q){return p-q}),med=am[Math.floor(am.length/2)];
    if(med<100||am.some(function(v){return Math.abs(v-med)>med*0.15}))return;
    var last=g.slice().sort(function(p,q){return p.date<q.date?1:-1})[0];
    rvCands.push({name:last.note,amt:Math.round(med),day:parseInt(last.date.slice(8),10),cat:last.cat});
  });
  rvCands.sort(function(p,q){return q.amt-p.amt});rvCands=rvCands.slice(0,3);
  if(rvCands.length){
    H+='<div class="fine" style="font-weight:700;margin-top:4px">Похоже на регулярные платежи</div><div class="list">'+rvCands.map(function(c,i){return '<div class="row"><div class="grow"><div class="t">'+esc(c.name)+'</div><div class="s">около '+money(c.amt)+' каждый месяц, примерно '+c.day+'-го</div></div>'+(S.simple?'':'<button class="btn ghost sm" style="flex:none" data-a="rvAddRec" data-id="'+i+'">В платежи</button>')+'</div>'}).join('')+'</div>';
  }
  /* 5. копилки */
  function saved(m){return S.entries.filter(function(x){if(x.type!=='t'||x.date.slice(0,7)!==m)return false;var ta=accById(x.to);return ta&&ta.type==='save'}).reduce(function(s,x){return s+x.amt},0)}
  var sv=saved(ym),svb=prev.length?prev.reduce(function(s,m){return s+saved(m)},0)/prev.length:0;
  if(sv||svb)H+='<div class="row" style="margin-top:4px"><div class="grow"><div class="t">Отложено в копилки</div><div class="s">'+(svb?'обычно '+money(svb)+' в месяц':'в этом месяце')+'</div></div><span class="amt in">'+money(sv)+'</span></div>';
  /* 6. подсказки */
  if(cur&&base&&left>0){var rem=base-spent;
    tips.push(rem>0?'Чтобы уложиться в свой обычный месяц ('+money(base)+'), до конца месяца тратить не больше '+money(rem/left)+' в день.':'Уже потрачено больше, чем в обычный месяц ('+money(base)+')'+(bigSum?', в том числе из-за крупных покупок на '+money(bigSum):'')+'. До конца месяца лучше оставить только обязательное.')}
  var oddCat={};odd.forEach(function(x){oddCat[x.cat]=(oddCat[x.cat]||0)+x.amt});var tu=up.filter(function(x){return x.c-(oddCat[x.k]||0)-x.b>=1000})[0];
  if(tu&&prev.length)tips.push('Сильнее всего выросли «'+cname(tu.k)+'»: +'+money(tu.df)+' к обычному. Загляни в эти траты в «Истории», что из них можно было пропустить.');
  var eat=(curCat.cafe||0)+(curCat.taxi||0),eatB=(baseCat.cafe||0)+(baseCat.taxi||0),bTo=baseTo||0;
  if(spent>3000&&eat/spent>0.2){var sh2=eat/spent,shB=bTo?eatB/bTo:0;
    tips.push('Кафе, доставка и такси — '+pct(sh2)+' трат'+(shB&&shB<sh2-0.03?' (обычно '+pct(shB)+'). Вернуть к обычной доле — это примерно '+money(eat-shB*spent)+' за месяц.':'. Это первое место, где обычно получается сэкономить без потерь.'))}
  if(!S.simple){var imp=list.filter(function(x){return x.cls==='imp'}).reduce(function(s,x){return s+x.amt},0);
    if(spent>0&&imp/spent>0.15)tips.push('Импульсивные покупки — '+pct(imp/spent)+' трат ('+money(imp)+'). Попробуй правило суток: хочешь что-то незапланированное — подожди день.')}
  if(rvCands.length&&!S.simple)tips.push('Добавь регулярные траты в «Платежи», тогда «доступно в день» и прогноз будут их учитывать заранее.');
  if(!tips.length&&base)tips.push('Траты в пределах твоей нормы, всё ровно. Так держать!');
  if(tips.length)H+='<div class="fine" style="font-weight:700;margin-top:4px">Подсказки</div><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px">'+tips.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul>';
  H+='<p class="fine">Считается по твоим записям. Возвраты и записи с галочкой «не считать в тратах» не учитываются. Для подробного разбора отправь выгрузку Claude.</p>';
  return H+'</div>';
}

/* ---------- разбор банковских выписок (PDF → операции) ---------- */
var BK={};
BK.num=function(s){s=String(s).replace(/[\s\u00a0\u202f]/g,'').replace(/RUR|RUB|₽/g,'').replace(',','.');var v=parseFloat(s);return isNaN(v)?null:v};
BK.date=function(s){var m=String(s).match(/^(\d\d)\.(\d\d)\.(\d\d|\d{4})$/);if(!m)return null;var y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2]+'-'+m[1]};
BK.isDate=function(s){return /^\d\d\.\d\d\.(\d\d|\d{4})$/.test(String(s).trim())};
BK.isMoney=function(s){return /^[+\-−]?\s?[\d\s\u00a0]+[.,]\d\d(\s?(RUR|RUB|₽))?$/.test(String(s).trim())};
BK.lines=function(items){
  var ls=[],sorted=items.slice().sort(function(a,b){return a.p-b.p||a.y-b.y||a.x-b.x});
  sorted.forEach(function(it){var l=ls[ls.length-1];
    if(l&&l.p===it.p&&Math.abs(l.y-it.y)<=2.5)l.items.push(it);else ls.push({p:it.p,y:it.y,items:[it]})});
  ls.forEach(function(l){l.items.sort(function(a,b){return a.x-b.x});l.text=l.items.map(function(i){return i.s.trim()}).join(' ')});
  return ls;
};
BK.clean=function(s){return String(s||'').replace(/\s+/g,' ').trim()};
BK.phone=function(s){s=String(s);var t=s.match(/тел\.?\s*\+?7?\s*(\d{10})\b/);if(t)return '7'+t[1];var m=s.match(/(?:^|[^A-Za-z0-9])(\+7|8)[\s(\-]*(\d{3})[\s)\-]*(\d{3})[\s\-]*(\d{2})[\s\-]*(\d{2})(?!\d)/);return m?'7'+m[2]+m[3]+m[4]+m[5]:''};
BK.fmtPhone=function(p){return p&&p.length===11?'+7 '+p.slice(1,4)+' '+p.slice(4,7)+'-'+p.slice(7,9)+'-'+p.slice(9):p};
BK.ownerFrom=function(text){var m=text.match(/(?:Клиент|Владелец счёта|Кому:)\s*([А-ЯЁ][А-ЯЁа-яё\-]+\s+[А-ЯЁ][А-ЯЁа-яё\-]+\s+[А-ЯЁ][А-ЯЁа-яё\-]+)/)||text.match(/\b([А-ЯЁ]{2,}\s+[А-ЯЁ]{2,}\s+[А-ЯЁ]{3,}(?:ВНА|ВИЧ|ИЧНА|ЧНА|ЬИЧ|ОГЛЫ|КЫЗЫ))\b/);return m?m[1]:''};
BK.mcc=function(s){var c=[],m=String(s).match(/MCC\s?(\d{4})/);if(m)c.push(m[1]);(String(s).match(/\b\d{4}\b/g)||[]).forEach(function(x){c.push(x)});for(var i=0;i<c.length;i++)if(BK.mccCat(c[i]))return c[i];return c[0]||''};
BK.detect=function(text){
  if(/Код операции/.test(text)&&/АЛЬФА-БАНК|Дата проводки/.test(text))return 'alfa';
  if(/СберБанк|sberbank/i.test(text))return 'sber';
  if(/Счет-выписка/.test(text)&&/Назначение платежа/.test(text))return 'otp';
  if(/Выписка по договору/.test(text)&&/Дата обработки|обработки/.test(text)&&/₽/.test(text))return 'tbank';
  if(/Сумма операции в валюте счета\/карты/.test(text)||(/Наименование/.test(text)&&/получателя\/|Отправителя/.test(text)))return 'vtb';
  return '';
};
BK.names={alfa:'Альфа-Банк',sber:'Сбер',vtb:'ВТБ',otp:'ОТП Банк',tbank:'Т-Банк'};
/* общий сборщик: якорные строки с датой + строки продолжения ниже */
BK.below=function(ls,isAnchor,isStop){
  var out=[],cur=null;
  ls.forEach(function(l){
    if(isAnchor(l)){cur={a:l,more:[]};out.push(cur);return}
    if(!cur)return;
    if(isStop(l)){cur.stopped=true;return}
    if(cur.stopped&&l.p===cur.a.p)return;
    cur.more.push(l);
  });
  return out;
};
BK.alfa=function(items){
  var ls=BK.lines(items),ops=[];
  var stop=function(l){return /Панченко|Уполномоченное лицо|подпись сотрудника|Страница \d+ из|Дата проводки|в валюте счета|Ф\.И\.О\./.test(l.text)};
  var rows=BK.below(ls,function(l){var f=l.items[0];return (BK.isDate(f.s)||f.s.trim()==='HOLD')&&f.x<60&&l.items.some(function(i){return i.x>480&&/RUR$/.test(i.s.trim())})},function(l){return stop(l)});
  rows.forEach(function(r){
    var it=r.a.items,amtIt=it.filter(function(i){return i.x>480&&/RUR$/.test(i.s.trim())})[0],code=(it[1]&&it[1].x<185?it[1].s.trim():'');
    var desc=BK.clean(it.filter(function(i){return i.x>=180&&i.x<505}).map(function(i){return i.s}).concat(r.more.map(function(l){return l.items.filter(function(i){return i.x>=180&&i.x<505}).map(function(i){return i.s}).join(' ')})).join(' '));
    var v=BK.num(amtIt.s);
    if(it[0].s.trim()==='HOLD'){
      if(/Кумулятивная/.test(desc))return;
      var hd=(desc.match(/дата операции:\s*(\d\d\.\d\d\.\d{4})/)||[])[1],hm=(desc.match(/Неподтвержденная операция:\s*\S+\s+\d+\s+RU\s+(.+?)>/)||[])[1]||'';
      hm=BK.clean(hm.replace(/-\s*\S*$/,'').replace(/\b\d{3,}\b/g,''));
      if(!hd)return;
      ops.push({bank:'alfa',key:'alfa_hold_'+BK.date(hd)+'_'+Math.abs(v)+'_'+hm.slice(0,16),date:BK.date(hd),amt:Math.abs(v),dir:v<0?'out':'in',raw:hm,desc:hm||'Покупка',merchant:hm||'Покупка',kind:'buy',hold:true});
      return;
    }
    var op={bank:'alfa',key:'alfa_'+(code||r.a.items[0].s+'_'+v),date:BK.date(it[0].s),amt:Math.abs(v),dir:v<0?'out':'in',raw:desc,desc:desc};
    var cm=desc.match(/дата совершения\s*операции:\s*(\d\d\.\d\d\.\d\d)/);if(cm)op.date=BK.date(cm[1]);
    var pm=desc.match(/место совершения операции:\s*(.*)$/);
    if(/Операция по карте/.test(desc)&&pm){var segs=pm[1].split('\\');var last=segs[segs.length-1];op.mcc=BK.mcc(last);op.merchant=BK.clean(last.replace(/MCC\s?\d{4}/,'').replace(/\b\d{3,}\b/g,''));op.kind='buy'}
    else if(/Систем\S* быстрых платежей/.test(desc)&&/^Перевод/.test(desc)){op.kind='sbp';op.phone=BK.phone(desc.replace(/^.*?(на|от)\s/,''));op.desc=(op.dir==='out'?'Перевод на ':'Перевод от ')+BK.fmtPhone(op.phone)}
    else if(/Внутрибанковский перевод между счетами/.test(desc)){op.kind='own';op.desc='Перевод между своими счетами'}
    else if(/^Платеж\s/.test(desc)){var mm=desc.match(/Платеж\s+\S+\s+в\s+(.+?)\s+через/);op.kind='buy';op.merchant=mm?BK.clean(mm[1].replace(/["«»]/g,'').replace(/\b\d{3,}\b/g,'')):'Оплата по QR (СБП)'}
    else if(/Возврат/.test(desc)){op.kind='refund';op.desc='Возврат'}
    else if(/Аванс|Заработная плата|зарплат/i.test(desc)){op.kind='salary';op.desc=/Аванс/.test(desc)?'Аванс':'Зарплата'}
    else if(/Страховые взносы|налог/i.test(desc)){op.kind='tax';op.desc=desc.split(',')[0]}
    else if(/Внесение средств|наличн/i.test(desc)){op.kind='cash';op.desc='Наличные'}
    ops.push(op);
  });
  return ops;
};
BK.sber=function(items){
  var ls=BK.lines(items),ops=[];
  var anc=function(l){return l.items.length>=3&&BK.isDate(l.items[0].s)&&l.items[0].x<80&&/^\d\d:\d\d$/.test(l.items[1].s.trim())};
  var rows=BK.below(ls,anc,function(l){return /Дата формирования|ПАО Сбербанк|^ДАТА ОПЕРАЦИИ/.test(l.text)});
  rows.forEach(function(r){
    var it=r.a.items,cat=BK.clean(it.filter(function(i){return i.x>=140&&i.x<360}).map(function(i){return i.s}).join(' '));
    var am=it.filter(function(i){return i.x>=360&&i.x<480&&BK.isMoney(i.s)})[0];if(!am)return;
    var sign=/^\s*\+/.test(am.s),v=Math.abs(BK.num(am.s)),l2=r.more[0],auth='',desc='';
    if(l2&&BK.isDate(l2.items[0].s)){auth=(l2.items[1]&&/^\d+$/.test(l2.items[1].s.trim()))?l2.items[1].s.trim():'';desc=BK.clean(l2.items.filter(function(i){return i.x>=140&&i.x<360}).map(function(i){return i.s}).join(' '))}
    r.more.slice(1).forEach(function(l){desc+=' '+l.items.filter(function(i){return i.x>=140&&i.x<360}).map(function(i){return i.s}).join(' ')});

  var msg=document.getElementById('s_bkmsg');function say(t){if(msg){msg.textContent=t;msg.hidden=false}}
  say('Читаю выписку…');
  bkLoadPdf(function(err){
    if(err){say('Не получилось загрузить модуль чтения PDF. Проверь интернет и попробуй ещё раз.');toast('Не получилось прочитать PDF',true);return}
    var all=[],banks=[],bad=[],chain=Promise.resolve();
    Array.prototype.forEach.call(files,function(f){chain=chain.then(function(){return f.arrayBuffer().then(bkItems).then(function(items){
      var res=BK.parse(items);if(!res.bank){bad.push(f.name);return}
      if(banks.indexOf(res.name)<0)banks.push(res.name);
      res.ops.forEach(function(op){all.push({op:op,owner:res.owner})});
    }).catch(function(e){bad.push(f.name+(e&&/password/i.test(e.name||e.message)?' (файл под паролем)':''))})})});
    chain.then(function(){
      if(!all.length){say(bad.length?'Не узнала формат: '+bad.join(', ')+'. Сейчас читаю PDF-выписки Альфа-Банка, Сбера, ВТБ, ОТП и Т-Банка.':'В выписке не нашлось операций.');toast('Операций не найдено',true);return}
      var seenK={};all=all.filter(function(o){if(seenK[o.op.key])return false;seenK[o.op.key]=1;return true});
      sh={bk:true,ops:all,banks:banks,manualCat:{},showAll:false};bkReclass();bkSheet();
      if(bad.length)toast('Не узнала: '+bad.join(', '),true);
    });
  });
}
function bkAdd(){

  if(S.demo){S.entries=S.entries.filter(function(e){return !e.demo});S.recur=(S.recur||[]).filter(function(e){return !e.demo});S.incomes=(S.incomes||[]).filter(function(e){return !e.demo});S.accounts.forEach(function(x){if(x.demoStart){x.start=0;delete x.demoStart}});S.demo=false}
  var have={};S.entries.forEach(function(e){have[e.id]=1});
  add.forEach(function(r){var id='bk_'+r.key;if(have[id])return;
    var en={id:id,type:r.type,amt:r.amt,cat:r.cat,date:r.date,note:r.note,cls:r.type==='e'?(NEEDC[r.cat]?'need':'mind'):'',acc:defAcc(),hist:true,bank:r.bank};if(r.hold)en.hold=true;S.entries.push(en);n++;

}

function viewAn(){

  me.forEach(function(x){if(x.type==='e'&&!x.skip)per[parseInt(x.date.slice(8),10)-1]+=x.amt});
  var mx=Math.max.apply(null,per.concat([1])),W=340,H=120,pl=0,pb=18,pt=14,bw=W/n,svg='';
  svg+='<line x1="0" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="var(--line)"/>';
  svg+='<line x1="0" x2="'+W+'" y1="'+pt+'" y2="'+pt+'" stroke="var(--line)" stroke-dasharray="3 3"/>';
  svg+='<text x="0" y="'+(pt-3)+'" font-size="9">'+Math.round(mx).toLocaleString('ru-RU')+' ₽</text>';

    var d=i+1;if(d===1||d%5===0)svg+='<text x="'+(i*bw+bw/2).toFixed(1)+'" y="'+(H-4)+'" font-size="9" text-anchor="middle">'+d+'</text>';

  var cl=Object.keys(cat).sort(function(p,q){return cat[q]-cat[p]});

function quickLists(type){
  var cut=iso(addDays(parse(T),-90)),cats={},notes={};
  S.entries.forEach(function(x){
    if(x.demo||x.type!==type||x.date<cut||!x.cat)return;
    cats[x.cat]=(cats[x.cat]||0)+1;
    var n=norm(x.note);if(!n)return;
    var o=notes[n]||(notes[n]={n:1,note:x.note,cat:x.cat,amt:x.amt,cls:x.cls,acc:x.acc,date:x.date});
    if(o!==notes[n])return;
  });
  S.entries.forEach(function(x){if(x.demo||x.type!==type||x.date<cut||!x.note)return;var o=notes[norm(x.note)];if(o&&x.date>=o.date){o.cat=x.cat;o.amt=x.amt;o.cls=x.cls;o.acc=x.acc;o.date=x.date}});

  return {cats:Object.keys(cats).sort(function(a,b){return cats[b]-cats[a]}).slice(0,6),

}

function exportText(scope){
  var list=S.entries.filter(function(x){return !x.demo&&(scope==='all'||x.date.slice(0,7)===vym)}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
  var per=scope==='all'?'все записи':(function(){var a=vym.split('-');return MONTHS[+a[1]-1]+' '+a[0]})();
  var L=[];
  L.push('ВЫГРУЗКА считалОчки. Период: '+per+'. Сформировано: '+T+'. Валюта: ₽.');
  L.push('Остатки сейчас: '+S.accounts.map(function(a){return accName(a)+' '+exAmt(accBal(a))}).join('; ')+'.');
  var refS=0,inc=0,exp=0,expMain=0,expFund=0,cat={},byAcc={};
  list.forEach(function(x){
    if(x.skip)return;
    if(x.type==='i'){inc+=x.amt;if(x.cat==='refund')refS+=x.amt}
    else if(x.type==='e'){exp+=x.amt;var a=accById(accOf(x));var nm=a?accName(a):'?';byAcc[nm]=(byAcc[nm]||0)+x.amt;if(offMain(x))expFund+=x.amt;else expMain+=x.amt;
      var c=cat[x.cat]||(cat[x.cat]={sum:0,n:0,acc:{}});c.sum+=x.amt;c.n++;c.acc[nm]=(c.acc[nm]||0)+x.amt}
  });
  L.push('Итого за период: расходы '+exAmt(exp)+' (со свободных денег '+exAmt(expMain)+', из копилок '+exAmt(expFund)+'); возвраты '+exAmt(refS)+'; ЧИСТЫЕ РАСХОДЫ (расходы минус возвраты) '+exAmt(exp-refS)+(S.simple?'':'; прочие доходы '+exAmt(inc-refS))+'.');
  L.push('Записи с пометкой «не считать» в итоги не входят.');
  if(Object.keys(byAcc).length>1)L.push('Расходы по счетам: '+Object.keys(byAcc).map(function(k){return k+' '+exAmt(byAcc[k])}).join('; ')+'.');
  var ck=Object.keys(cat).sort(function(p,q){return cat[q].sum-cat[p].sum});
  L.push('');L.push('Расходы по категориям (категория: сумма, число трат, доля, со счетов):');
  if(!ck.length)L.push('нет расходов');
  ck.forEach(function(k){var c=cat[k];L.push('- '+exCat(k)+': '+exAmt(c.sum)+', '+c.n+' шт., '+Math.round(c.sum/exp*100)+'%, '+Object.keys(c.acc).map(function(n){return n+' '+exAmt(c.acc[n])}).join(' / '))});
  L.push('');L.push('Записи (дата | тип | сумма | категория | заметка | счёт):');
  if(!list.length)L.push('нет записей');
  list.forEach(function(x){
    var nt=String(x.note||'').replace(/[|\n]/g,' ').trim();
    if(x.type==='t'){var fa=accById(x.from),ta=accById(x.to);L.push(x.date+' | перевод | '+exAmt(x.amt)+' | - | '+nt+' | '+(fa?accName(fa):'?')+' → '+(ta?accName(ta):'?'))}
    else{var a=accById(accOf(x));L.push(x.date+' | '+(x.type==='i'?(x.cat==='refund'?'возврат':'доход'):'расход')+' | '+exAmt(x.amt)+' | '+exCat(x.cat)+' | '+nt+(x.skip?' [не считать]':'')+' | '+(a?accName(a):'?'))}
  });
  return L.join('\n');
}

function helpSheet(){openSheet('<h3>Как пользоваться</h3><div class="help f" style="gap:8px"><details open><summary>С чего начать</summary><div class="hb"><ul><li>Сначала тут примеры. Посмотри, как всё выглядит, потом нажми «Очистить примеры» на главной.</li><li>Нажми «Поправить остаток» и впиши, сколько сейчас денег на карте. От этой суммы всё и считается.</li><li>Дальше просто записывай траты, когда тратишь.</li></ul></div></details><details><summary>Загрузить выписку из банка</summary><div class="hb"><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px"><li>В приложении банка закажи выписку по счёту или карте за нужный период в формате PDF и сохрани файл. Подходят Альфа-Банк, Сбер, ВТБ, ОТП и Т-Банк.</li><li>Здесь: шестерёнка → «Загрузить выписку из банка» → выбери файл (можно несколько сразу).</li><li>Появится список операций. Отмечено то, что пойдёт в траты и доходы: покупки, зарплата, возвраты. Переводы себе, наличные и уже загруженное пропущены.</li><li>Если в выписке есть переводы по номеру телефона, приложение спросит, чей номер: твой (пропускать), «делим траты» (его переводы тебе считаются возвратами, твои ему — расходами) или чужой. Ответ запоминается.</li><li>Проверь категории, сними лишнее и нажми «Добавить».</li></ol><p>Повторная загрузка той же выписки дублей не создаст. Если трату ты уже вносила руками, приложение заметит похожую запись и не будет отмечать её второй раз. Записи из выписки входят в траты и анализ, но остатки на счетах не меняют.</p></div></details><details><summary>Как записать трату</summary><div class="hb"><ul><li>Большая кнопка «+» внизу.</li><li>Впиши сумму и на что потратила, например «Пятёрочка» или «такси». Категория подберётся сама, её можно поменять. Если не угадала, выбери вручную, и в следующий раз приложение запомнит. Нет подходящей категории? В конце списка есть «＋ Своя категория…», а управлять своими категориями можно в настройках (шестерёнка).</li><li>Частые траты и категории появятся кнопками, чтобы записывать в одно касание.</li><li>Деньги вернули или пришли — переключи сверху на «Возврат» (в полном режиме «Доход»).</li><li>Чужие деньги или обмен — поставь галочку «Не считать в тратах».</li><li>Ошиблась — открой запись в «Истории», поправь или удали.</li></ul></div></details><details><summary>Копилки и долги</summary><div class="hb"><ul><li>Копилка — деньги, отложенные на цель: отпуск, подушка, подарки. В «Свободные деньги» они не входят.</li><li>Завести: на главной «Новая копилка». Там же можно завести долг.</li><li>«Отложить» переводит деньги с карты в копилку, «Достать» — обратно.</li><li>Если платишь прямо из копилки, выбери её в записи в поле «Со счёта».</li></ul></div></details><details><summary>Монстрик</summary><div class="hb"><p>Питомец на главной. Нажми на него, чтобы выбрать другого монстрика (их четыре) и дать имя. Он питается записями, а не тратами: голодный, пока за сегодня нет записей, и сытый, когда за сегодня есть записи или отмечено «Сегодня без трат» (это его любимый корм). Грустит, если в среднем за месяц ты тратишь больше плана. В полном режиме за хорошие дни дают опыт, уровни и награды.</p></div></details><details><summary>История и анализ</summary><div class="hb"><ul><li>«История» — все записи по месяцам, стрелками можно листать.</li><li>«Анализ» — куда уходят деньги: по категориям и по дням.</li><li>Вверху «Анализа» — «Разбор месяца»: прогноз до конца месяца, сравнение с твоими обычными месяцами, необычно крупные траты, регулярные платежи, которые стоит внести в план, и подсказки, где сэкономить.</li><li>«Выгрузить для анализа» даёт текст со всеми тратами. Его можно вставить в чат с Claude и попросить разобрать.</li></ul></div></details><details><summary>Простой и полный режим</summary><div class="hb"><p>Сначала включён простой режим: траты, копилки, история и анализ. В настройках (шестерёнка) можно включить полный. В нём появляются:</p><ul><li>вкладка «Платежи»: зарплата и обязательные платежи (квартира, связь) с днями, чтобы приложение напоминало и считало, сколько можно тратить в день;</li><li>раскладка: правила вида «10-го откладывать 5 000 ₽ в Отпуск», в день выплаты приложение предложит разложить деньги;</li><li>игра с уровнями и заданиями, дневной лимит и тип траты (обязательная, осознанная, импульсивная).</li></ul><p>Переключаться можно в любой момент, данные не теряются.</p></div></details><details><summary>Как поставить на главный экран</summary><div class="hb"><p><b>Android, Google Chrome:</b></p><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px"><li>Открой ссылку на приложение именно в Chrome. Если открыла из Телеграма, нажми ⋮ вверху справа → «Открыть в Chrome».</li><li>Нажми ⋮ (три точки) в правом верхнем углу Chrome.</li><li>Выбери «Установить приложение». Если такого пункта нет, выбери «Добавить на главный экран», а затем «Установить».</li><li>Подтверди. На главном экране появится фиолетовый значок «считалОчка».</li><li>Дальше открывай только через значок. Приложение откроется без адресной строки и будет работать даже без интернета.</li></ol><p><b>iPhone, Safari:</b> кнопка «Поделиться» (квадрат со стрелкой) → «На экран «Домой»» → «Добавить».</p><p class="fine">Записи живут в браузере, через который приложение установлено. Если удалить значок через «Удалить приложение» или очистить данные Chrome, записи сотрутся, поэтому делай копии (раздел ниже).</p></div></details><details><summary>Перенести данные из другого приложения</summary><div class="hb"><p><b>Из другой считалОчки</b> (файла или старой ссылки):</p><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px"><li>Открой старую считалОчку, там шестерёнка → «Сохранить файл». Сохрани или отправь себе в «Избранное» в Телеграме.</li><li>Открой эту считалОчку → шестерёнка → «Восстановить из файла» и выбери сохранённый файл.</li><li>Всё переедет целиком: записи, копилки, платежи, уровень Копейки. То, что было здесь до этого, заменится.</li></ol><p>Если «Сохранить файл» не срабатывает, нажми там «Копировать текст», а здесь вставь его в поле «Или из текста» и нажми «Восстановить».</p><p><b>Из другого приложения для учёта трат или из банка:</b></p><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px"><li>Выгрузи данные из того приложения (обычно «Экспорт» в настройках, файл CSV или Excel) или скачай выписку в банке.</li><li>Скопируй запрос ниже и отправь его Claude вместе с этим файлом.</li><li>Claude вернёт текст или файл. Здесь: шестерёнка → «Добавить записи из текста» → выбери файл или вставь текст → «Добавить».</li><li>Записи допишутся к текущим, ничего не сотрётся. Если загрузить то же самое ещё раз, дублей не будет.</li></ol><textarea id="h_prompt" readonly style="width:100%;min-height:90px;font-size:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:10px">Сделай из этих данных записи для приложения считалОчка. Ответь только JSON-списком, без пояснений. Каждая запись: {&quot;id&quot;: уникальная строка, &quot;type&quot;: &quot;e&quot; для расхода или &quot;i&quot; для дохода, &quot;amt&quot;: сумма числом больше нуля, &quot;cat&quot;: категория, &quot;date&quot;: дата в виде ГГГГ-ММ-ДД, &quot;note&quot;: короткое описание}. Категории расходов: prod продукты, cafe кафе и доставка, trans транспорт, taxi такси, rent жильё, kom коммуналка, conn связь, subs подписки, health здоровье, pharm аптека, beauty красота, cloth одежда, tech техника, fun развлечения, gift подарки, edu образование, trip путешествия, sport спорт, home дом и быт, pets питомцы, debt долги, tax налоги, save накопления, help помощь близким, other прочее. Категории доходов: salary зарплата, side подработка, gift_in подарок, refund возврат, other_in прочее. Переводы между своими счетами не включай. Если файл большой, сохрани результат в файл .json.</textarea><button type="button" class="btn sm" data-a="copyPrompt">Скопировать запрос для Claude</button></div></details><details><summary>Чтобы данные не пропали</summary><div class="hb"><ul><li>Записи хранятся только у тебя в телефоне, в этом браузере. На сайт они не отправляются, их никто, кроме тебя, не видит.</li><li>Открывай приложение всегда одним способом: значком на экране или в том же браузере. В другом браузере или на другом телефоне оно будет пустым.</li><li>Если очистить данные браузера или удалить приложение, записи сотрутся.</li><li>Раз в неделю делай копию: шестерёнка → «Сохранить файл» и отправь его себе в «Избранное». Восстановить можно там же, в том числе на новом телефоне.</li></ul></div></details></div><button type="button" class="btn ghost" data-a="close">Закрыть</button>')}

function toast(m,bad){var t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');t.style.cssText='position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:99;padding:14px 16px;border-radius:14px;font-weight:600;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25);color:#fff';document.body.appendChild(t)}t.style.background=bad?'#c0392b':'#1e9e5a';t.textContent=(bad?'✕ ':'✓ ')+m;t.hidden=false;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},4000)}

  else if(a==='toggle'){

var DB=null,COL=null,UID=null,known={},pushT=null,pushing=false,initDone=false,pendingR=false,syncState='off';
function syncLabel(){return syncState==='ok'?'синхронизация вкл.':syncState==='wait'?'синхронизация…':syncState==='err'?'нет синхронизации':syncState==='ro'?'только чтение':''}

function cfgOf(){var c={};Object.keys(S).forEach(function(k){if(k!=='entries')c[k]=S[k]});return c}
function partsOf(){
  var p={cfg:JSON.stringify(cfgOf())},by={};
  S.entries.forEach(function(x){var m=x.date.slice(0,7);(by[m]=by[m]||[]).push(x)});
  Object.keys(by).forEach(function(m){p['e_'+m]=JSON.stringify(by[m])});

function syncSoon(){if(!DB||!initDone)return;clearTimeout(pushT);pushT=setTimeout(push,700);syncState='wait';renderBadge()}
async function push(){
  if(pushing){pushT=setTimeout(push,700);return}
  pushing=true;
  try{
    var p=partsOf(),ids=Object.keys(p);
    for(var i=0;i<ids.length;i++){
      var id=ids[i];if(known[id]===p[id])continue;
      var prev=known[id];known[id]=p[id];
      try{await COL.doc(id).set({j:p[id]})}catch(e){if(prev===undefined)delete known[id];else known[id]=prev;throw e}
    }
    syncState='ok';
  }catch(e){syncState=(e&&e.code==='invalid_argument')?'ro':'err'}
  pushing=false;renderBadge();
}

    if(snap.metadata&&snap.metadata.fromCache)return;
    if(!initDone){initDone=true;push()}
    return;
  }
  var changed=ids.some(function(id){return known[id]!==docs[id]});
  var first=!initDone;initDone=true;
  if(!changed||pushing){if(first){syncState='ok';renderBadge()}return}
