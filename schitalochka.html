<style>
/* Layout: one narrow column, wallet on top, tab bar at the bottom, entry form as a bottom sheet. */
:root{
  --bg:#f2f0f7; --surface:#ffffff; --surface2:#e9e6f2; --ink:#1d1830; --muted:#6a6385; --line:#dcd7ea;
  --accent:#6a45e8; --accent-ink:#ffffff; --in:#0d7f58; --out:#cf3f3a; --warn:#a96a0c; --warn-bg:#fbf0d9; --bad-bg:#fbe3e1; --good-bg:#dff3e9; --gold:#d99a1a;
  --font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14111c; --surface:#1e1a29; --surface2:#292335; --ink:#f1ecf9; --muted:#a99bc2; --line:#34293f;
    --accent:#a98bff; --accent-ink:#17102b; --in:#6fdca6; --out:#ff8080; --warn:#f0c674; --warn-bg:#3a2f18; --bad-bg:#3b1f24; --good-bg:#1b3328; --gold:#f0c674; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14111c; --surface:#1e1a29; --surface2:#292335; --ink:#f1ecf9; --muted:#a99bc2; --line:#34293f;
  --accent:#a98bff; --accent-ink:#17102b; --in:#6fdca6; --out:#ff8080; --warn:#f0c674; --warn-bg:#3a2f18; --bad-bg:#3b1f24; --good-bg:#1b3328; --gold:#f0c674; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:0 96px;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:16px}
h1,h2,h3,p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
.ico{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.ico svg{width:20px;height:20px}
.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hero{background:var(--accent);color:var(--accent-ink);gap:6px}
.hero .lbl{font-size:13px;opacity:.8}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.stat{background:rgba(255,255,255,.14);border-radius:12px;padding:10px;min-width:0}
.stat .lbl{font-size:11px;opacity:.85}
.stat b{display:block;font-size:15px;font-weight:700;margin-top:2px;white-space:nowrap}
.note{border-radius:14px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.note b{font-size:14px}
.note.good{background:var(--good-bg)} .note.warn{background:var(--warn-bg)} .note.bad{background:var(--bad-bg)}
.note.info{background:var(--surface);}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted)}
.amt{font-weight:700;white-space:nowrap}
.amt.in{color:var(--in)} .amt.out{color:var(--out)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.list{display:flex;flex-direction:column}
.list .row{padding-block:10px;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.list .row:first-child{border-top:0}
.daytitle{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600;padding:4px 2px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav b{font-size:16px;text-transform:capitalize}
.nav button{width:40px;height:40px;border-radius:12px;background:var(--surface);font-size:18px;color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 16px;font-weight:700}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--out)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.split i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-size:34px;font-weight:800;line-height:1}
.empty{color:var(--muted);font-size:14px;padding-block:8px}
svg text{fill:var(--muted);font-family:var(--font)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--accent)}
.tabs .plus{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);margin:-18px auto 0;display:grid;place-items:center;box-shadow:0 4px 14px rgba(106,69,232,.4)}
.tabs .plus svg{width:26px;height:26px}
.ov{position:fixed;inset:0;background:rgba(10,6,20,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.ov[hidden],[hidden]{display:none!important}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:18px;font-weight:800}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.f input.amount{font-size:26px;font-weight:800}
.f textarea{min-height:70px;resize:vertical;font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-block;background:var(--surface2);border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;color:var(--muted)}
.chip.ok{background:var(--good-bg);color:var(--in)}
.chip.late{background:var(--warn-bg);color:var(--warn)}
.sum3{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:6px 10px;font-size:13px;align-items:center}
.sum3 .h{color:var(--muted);font-size:11.5px;font-weight:600}
.sum3 .r{text-align:right;white-space:nowrap}
.fine{font-size:12.5px;color:var(--muted)}
.bigsum{font-size:30px;font-weight:800;letter-spacing:-.02em}
.card.game{flex-direction:row;align-items:center;text-align:left;width:100%;gap:14px}
.petbox{flex:none;width:72px;height:72px;display:block}
.gi{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.gt{font-weight:700}
.game .bar{display:block}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.stats3 div{display:flex;flex-direction:column;gap:2px}
.stats3 b{font-size:24px;font-weight:800}

function quickLists(type){
  var cut=iso(addDays(parse(T),-90)),cats={},notes={};
  S.entries.forEach(function(x){
    if(x.demo||x.type!==type||x.date<cut||!x.cat)return;
    cats[x.cat]=(cats[x.cat]||0)+1;
    var n=norm(x.note);if(!n)return;
    var o=notes[n]||(notes[n]={n:1,note:x.note,cat:x.cat,amt:x.amt,cls:x.cls,acc:x.acc,date:x.date});
    if(o!==notes[n])return;
  });
  S.entries.forEach(function(x){if(x.demo||x.type!==type||x.date<cut||!x.note)return;var o=notes[norm(x.note)];if(o&&x.date>=o.date){o.cat=x.cat;o.amt=x.amt;o.cls=x.cls;o.acc=x.acc;o.date=x.date}});
  S.entries.forEach(function(x){if(x.demo||x.type!==type||x.date<cut||!x.note)return;var o=notes[norm(x.note)];if(o)o.c=(o.c||0)+1});
  return {cats:Object.keys(cats).sort(function(a,b){return cats[b]-cats[a]}).slice(0,6),
    notes:Object.keys(notes).map(function(k){return notes[k]}).sort(function(a,b){return b.c-a.c||(b.date<a.date?-1:1)}).slice(0,5)};
}

function exportText(scope){
  var list=S.entries.filter(function(x){return !x.demo&&(scope==='all'||x.date.slice(0,7)===vym)}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
  var per=scope==='all'?'все записи':(function(){var a=vym.split('-');return MONTHS[+a[1]-1]+' '+a[0]})();
  var L=[];
  L.push('ВЫГРУЗКА считалОчки. Период: '+per+'. Сформировано: '+T+'. Валюта: ₽.');
  L.push('Остатки сейчас: '+S.accounts.map(function(a){return accName(a)+' '+exAmt(accBal(a))}).join('; ')+'.');
  var refS=0,inc=0,exp=0,expMain=0,expFund=0,cat={},byAcc={};
  list.forEach(function(x){
    if(x.skip)return;
    if(x.type==='i'){inc+=x.amt;if(x.cat==='refund')refS+=x.amt}
    else if(x.type==='e'){exp+=x.amt;var a=accById(accOf(x));var nm=a?accName(a):'?';byAcc[nm]=(byAcc[nm]||0)+x.amt;if(offMain(x))expFund+=x.amt;else expMain+=x.amt;
      var c=cat[x.cat]||(cat[x.cat]={sum:0,n:0,acc:{}});c.sum+=x.amt;c.n++;c.acc[nm]=(c.acc[nm]||0)+x.amt}
  });
  L.push('Итого за период: расходы '+exAmt(exp)+' (со свободных денег '+exAmt(expMain)+', из копилок '+exAmt(expFund)+'); возвраты '+exAmt(refS)+'; ЧИСТЫЕ РАСХОДЫ (расходы минус возвраты) '+exAmt(exp-refS)+(S.simple?'':'; прочие доходы '+exAmt(inc-refS))+'.');
  L.push('Записи с пометкой «не считать» в итоги не входят.');
  if(Object.keys(byAcc).length>1)L.push('Расходы по счетам: '+Object.keys(byAcc).map(function(k){return k+' '+exAmt(byAcc[k])}).join('; ')+'.');
  var ck=Object.keys(cat).sort(function(p,q){return cat[q].sum-cat[p].sum});
  L.push('');L.push('Расходы по категориям (категория: сумма, число трат, доля, со счетов):');
  if(!ck.length)L.push('нет расходов');
  ck.forEach(function(k){var c=cat[k];L.push('- '+exCat(k)+': '+exAmt(c.sum)+', '+c.n+' шт., '+Math.round(c.sum/exp*100)+'%, '+Object.keys(c.acc).map(function(n){return n+' '+exAmt(c.acc[n])}).join(' / '))});
  L.push('');L.push('Записи (дата | тип | сумма | категория | заметка | счёт):');
  if(!list.length)L.push('нет записей');
  list.forEach(function(x){
    var nt=String(x.note||'').replace(/[|\n]/g,' ').trim();
    if(x.type==='t'){var fa=accById(x.from),ta=accById(x.to);L.push(x.date+' | перевод | '+exAmt(x.amt)+' | - | '+nt+' | '+(fa?accName(fa):'?')+' → '+(ta?accName(ta):'?'))}
    else{var a=accById(accOf(x));L.push(x.date+' | '+(x.type==='i'?(x.cat==='refund'?'возврат':'доход'):'расход')+' | '+exAmt(x.amt)+' | '+exCat(x.cat)+' | '+nt+(x.skip?' [не считать]':'')+' | '+(a?accName(a):'?'))}
  });
  return L.join('\n');
}

function helpSheet(){openSheet('<h3>Как пользоваться</h3><div class="help f" style="gap:8px"><details open><summary>С чего начать</summary><div class="hb"><ul><li>Нажми «Поправить остаток» на главном и впиши, сколько сейчас денег на карте в банке. От этой суммы считаются свободные деньги.</li><li>Нажми на каждую копилку и впиши, сколько там сейчас по банку.</li><li>Дальше просто записывай траты и возвраты.</li></ul></div></details><details><summary>Как записать трату</summary><div class="hb"><ul><li>Большая кнопка «+» внизу.</li><li>Впиши сумму и на что потратила, например «Пятёрочка» или «такси». Категория подберётся сама, её можно поменять. Если не угадала, выбери вручную, и в следующий раз приложение запомнит.</li><li>Дату можно изменить, если вносишь позже.</li><li>«Со счёта»: по умолчанию свободные деньги. Выбирай копилку, только если платила оттуда, например за зубы из «Платежей».</li></ul></div></details><details><summary>Возвраты</summary><div class="hb"><ul><li>Парень вернул часть, магазин вернул деньги, друзья скинулись за пиццу: нажми «+» → «Возврат» и впиши сумму.</li><li>Возврат вычитается из трат месяца. Пример: продукты на 3 000 ₽, внеси трату 3 000 ₽, а когда парень переведёт половину, внеси возврат 1 500 ₽. Чистая трата 1 500 ₽.</li></ul></div></details><details><summary>Что не вносить</summary><div class="hb"><ul><li>Переводы между своими счетами и картами.</li><li>Зарплату, подкопку и платежи по плану.</li><li>Автопополнения Яндекса: вносится только сама покупка.</li><li>Чужие деньги (например, парень перевёл на заказ) или обмен: поставь галочку «Не считать в тратах».</li><li>Ошиблась: открой запись в «Истории», поправь или удали.</li></ul></div></details><details><summary>Копилки</summary><div class="hb"><ul><li>«Подкопка» неприкосновенная и в «Свободные деньги» не входит.</li><li>«Платежи», «Таблы», «Подписки» и другие резервы идут на траты по плану: аренду, зубы, подписки. Когда платишь оттуда, выбери копилку в поле «Со счёта».</li><li>«Отложить» переводит деньги в копилку, «Достать» забирает обратно.</li><li>Остаток копилки можно поправить, нажав на неё и вписав сумму из банка.</li></ul></div></details><details><summary>Копейка</summary><div class="hb"><p>Монстрик на главной. Спит и хочет есть, если за сегодня нет записей. Радуется, если среднее за месяц в плане (1 650 ₽ в день). Грустит, если среднее за месяц выше плана. Один дорогой день его не расстраивает.</p></div></details><details><summary>История и анализ</summary><div class="hb"><ul><li>«История»: все записи по месяцам, листай стрелками.</li><li>«Анализ»: траты, возвраты, чистые расходы, расходы в день и по категориям.</li><li>«Выгрузить для анализа» даёт текст со всеми записями. Вставь его в чат с Claude, и он разберёт месяц.</li></ul></div></details><details><summary>Загрузить записи из банка</summary><div class="hb"><ul><li>Раз в месяц скачай выписку Альфы и сделай скрины Яндекса, отдай Claude и попроси сделать записи для считалочки.</li><li>Полученный файл загрузи в «Настройки» → «Добавить записи из текста».</li><li>Записи допишутся к текущим, ничего не сотрётся. Повторная загрузка дублей не создаёт.</li></ul></div></details><details><summary>Чтобы данные не пропали</summary><div class="hb"><ul><li>Данные хранятся в браузере. Очистка данных сайта их стирает.</li><li>Если пользуешься файлом, сохрани его в «Загрузки» и всегда открывай оттуда, не из мессенджера.</li><li>Раз в неделю «Настройки» → «Сохранить файл» и отправь себе в «Избранное». Восстановить можно там же.</li><li>Вкладку можно не закрывать. На следующий день страница сама обновит дату.</li></ul></div></details><details><summary>Простой и полный режим</summary><div class="hb"><p>Сейчас включён простой режим: траты, копилки, история и анализ. В настройках можно включить полный: появятся вкладка «Платежи», раскладка выплат, игра с уровнями и прогноз. Данные при переключении не теряются.</p></div></details></div><button type="button" class="btn" data-a="close">Понятно</button>');}

  if(document.getElementById('c_from')){
    var fr=document.getElementById('c_from').value;if(!fr)return showErr('Укажите дату.');
    var map={};document.querySelectorAll('select[data-n]').forEach(function(e){map[e.dataset.n]=e.value});
    var made={};
    Object.keys(map).forEach(function(n){
      if(map[n]==='new'){var na={id:uid(),name:n,type:'save',start:0};S.accounts.push(na);made[n]=na.id}else if(map[n]!=='none')made[n]=map[n];
    });
    S.rules=[];DEF_RULES.forEach(function(r,i){if(made[r[1]])S.rules.push({id:uid()+i,day:r[0],name:r[1],amt:r[2],acc:made[r[1]]})});
    S.planFrom=fr;S.skips=[];save();closeSheet();render();return;
  }
  if(document.getElementById('u_name')){
    var un=document.getElementById('u_name').value.trim(),ua=num(document.getElementById('u_amt').value),ud=parseInt(document.getElementById('u_day').value,10),uc=document.getElementById('u_acc').value;
    if(!un)return showErr('Введите название.');if(!(ua>0))return showErr('Введите сумму больше нуля.');if(!(ud>=1&&ud<=31))return showErr('День от 1 до 31.');if(!uc)return showErr('Выберите счёт.');
    if(sh.id)S.rules.forEach(function(r){if(r.id===sh.id){r.name=un;r.amt=ua;r.day=ud;r.acc=uc}});else S.rules.push({id:uid(),name:un,amt:ua,day:ud,acc:uc});
    if(!S.planFrom)S.planFrom=T;save();closeSheet();render();return;
  }
  if(document.getElementById('k_res')){
    var out='';document.querySelectorAll('input[data-id]').forEach(function(e){
      if(e.value.trim()==='')return;var v=num(e.value);if(!isFinite(v))return;var a=accById(e.dataset.id),diff=v-accBal(a);
      out+='<div class="row" style="padding-block:6px"><div class="grow"><div class="t">'+esc(a.name)+'</div><div class="s">'+(Math.abs(diff)<0.5?'совпадает':'в банке '+(diff>0?'больше':'меньше')+' на '+money(Math.abs(diff)))+'</div></div>'+(Math.abs(diff)<0.5?'<span class="chip ok">ок</span>':'<button type="button" class="btn sm" data-a="fixBal" data-id="'+a.id+'" data-k="'+diff+'">Поправить</button>')+'</div>';
    });
    document.getElementById('k_res').innerHTML=out||'<p class="fine">Впишите хотя бы один остаток.</p>';return;
  }
  if(document.getElementById('f_amt')){
    var gb=game(),d=readEntry(),n=num(d.amt);
    if(!(n>0))return showErr('Введите сумму больше нуля.');
    if(d.type==='t'){if(!d.from||!d.to||d.from===d.to)return showErr('Выберите два разных места.')}
    else if(!d.cat)return showErr('Выберите категорию.');
    if(!d.date)return showErr('Укажите дату.');
    if(d.type==='i')d.acc=defAcc();
    if(d.type==='e'){var sa=accById(d.acc);if(sa&&(sa.type==='save'||sa.type==='other')){var had=0;if(sh.id){S.entries.forEach(function(e){if(e.id===sh.id&&e.type==='e'&&e.acc===sa.id)had=e.amt})}if(accBal(sa)+had<n)return showErr('В копилке «'+sa.name+'» только '+money(accBal(sa)+had)+'. Выбери другой источник или сначала отложи деньги.')}}
    var rec=d.type==='t'?{type:'t',amt:n,cat:'',date:d.date,note:d.note.trim(),cls:'',from:d.from,to:d.to}:{type:d.type,amt:n,cat:d.cat,date:d.date,note:d.note.trim(),cls:d.type==='e'?(d.cls||'need'):'',acc:d.acc||defAcc(),skip:!!d.skip};
    if(sh.id){S.entries.forEach(function(e){if(e.id===sh.id){['acc','from','to'].forEach(function(k){delete e[k]});Object.keys(rec).forEach(function(k){e[k]=rec[k]})}})}
    else{rec.id=uid();S.entries.push(rec)}
    if(rec.type!=='t')learn(rec);
    vym=rec.date.slice(0,7);
    save();closeSheet();render();announce(gb,game());toast('Записано');
  }else if(document.getElementById('p_name')){
    var nm=document.getElementById('p_name').value.trim(),am=num(document.getElementById('p_amt').value),dy=parseInt(document.getElementById('p_day').value,10),ce=document.getElementById('p_cat');
    if(!nm)return showErr('Введите название.');
    if(!(am>0))return showErr('Введите сумму больше нуля.');
    if(!(dy>=1&&dy<=31))return showErr('Число месяца должно быть от 1 до 31.');
    var arr=sh.k==='r'?S.recur:S.incomes;
    if(sh.id){arr.forEach(function(e){if(e.id===sh.id){e.name=nm;e.amt=am;e.day=dy;if(ce)e.cat=ce.value;}})}
    else{var o={id:uid(),name:nm,amt:am,day:dy};if(ce)o.cat=ce.value;arr.push(o)}
    save();closeSheet();render();
  }else if(document.getElementById('a_name')){
    var ad=readAcc(),nm2=ad.name.trim(),sv=ad.start===''?0:num(ad.start);
    if(!nm2)return showErr('Введите название.');
    if(!isFinite(sv))return showErr('Введите сумму числом.');
    var val=ad.type==='debt'?-Math.abs(sv):sv,next=S.accounts.map(function(a){return a});
    if(sh.id)next=next.map(function(a){return a.id===sh.id?{id:a.id,name:nm2,type:ad.type,start:val-(accBal(a)-(+a.start||0))}:a});else next.push({id:uid(),name:nm2,type:ad.type,start:val});
    if(!next.some(function(a){return a.type==='main'}))return showErr('Должны остаться свободные деньги.');
    S.accounts=next;save();closeSheet();render();toast('Остаток сохранён');
  }else if(document.getElementById('s_lim')){
    var lm=num(document.getElementById('s_lim').value);S.dayLimit=lm>0?lm:2000;save();closeSheet();render();
  }
});
function autoFund(note){
  var d=sh&&sh.d;if(!d||d.type!=='e'||d.accManual)return;
  var n=norm(note),hit='';
  Object.keys(TKEY).forEach(function(k){if(!hit&&new RegExp(TKEY[k]).test(n)){var id=findAcc(k);if(id&&accBal(accById(id))>0)hit=id}});
  var sel=document.getElementById('f_acc'),hint=document.getElementById('f_fh');
  if(hit){d.acc=hit;d.fund=true}else if(d.fund){d.acc=defAcc();d.fund=false}
  if(sel)sel.value=d.acc;if(hint){hint.hidden=!d.fund;hint.textContent='Нашла копилку по заметке. Можно поменять.'}
}
document.addEventListener('input',function(ev){
  if(ev.target.id==='f_note')autoFund(ev.target.value);
  if(ev.target.id!=='f_note'||!sh||!sh.d||sh.d.manual||sh.d.type==='t')return;
  var d=sh.d,g=guess(ev.target.value,d.type),sel=document.getElementById('f_cat'),hint=document.getElementById('f_hint');
  if(g){sel.value=g;d.cat=g;d.auto=true;d.unk=false;if(hint){hint.textContent='Подобрана по заметке. Можно поменять.';hint.hidden=false}autoCls(g)}
  else{d.auto=false;var has=ev.target.value.trim().length>=3;d.unk=has;if(hint){hint.textContent='Не поняла по заметке. Выберите категорию, в следующий раз запомню.';hint.hidden=!has}if(has&&!d.manual){sel.value='';d.cat=''}}
});
document.addEventListener('change',function(ev){
  if(ev.target.id==='a_type'&&sh&&sh.ac){readAcc();accSheet();return}
  if(ev.target.id==='f_acc'&&sh&&sh.d){sh.d.accManual=true;sh.d.acc=ev.target.value;sh.d.fund=false;var fh=document.getElementById('f_fh');if(fh)fh.hidden=true}
  if(ev.target.id==='f_cat'&&sh&&sh.d){sh.d.manual=true;sh.d.auto=false;sh.d.cat=ev.target.value;var h=document.getElementById('f_hint');if(h)h.hidden=true}
});
document.addEventListener('change',function(ev){
  if(ev.target.id==='s_afile'&&ev.target.files&&ev.target.files[0]){var fr2=new FileReader();fr2.onload=function(){document.getElementById('s_add').value=fr2.result;var bt=document.querySelector('[data-a=addRecs]');if(bt)bt.click()};fr2.readAsText(ev.target.files[0]);return}
  if(ev.target.id!=='s_file'||!ev.target.files||!ev.target.files[0])return;
  var fr=new FileReader(),m=document.getElementById('s_msg');
  fr.onload=function(){try{var o=JSON.parse(fr.result);if(!o||!Array.isArray(o.entries)||!Array.isArray(o.recur)||!Array.isArray(o.incomes))throw 0;S=migrate(o);save();closeSheet();render()}catch(e){m.textContent='Не получилось прочитать файл.';m.hidden=false}};
  fr.readAsText(ev.target.files[0]);
});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&iso(new Date())!==T&&(!sh)){try{location.reload()}catch(e){}}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!document.getElementById('ov').hidden)closeSheet()});


/* ---------- общее хранилище (только в веб-версии, где есть db) ---------- */
var DB=null,COL=null,UID=null,known={},pushT=null,pushing=false,initDone=false,pendingR=false,syncState='off';
function syncLabel(){return syncState==='ok'?'синхронизация вкл.':syncState==='wait'?'синхронизация…':syncState==='err'?'нет синхронизации':syncState==='ro'?'только чтение':''}
function renderBadge(){var e=document.getElementById('syncb');if(e)e.textContent=syncLabel()}
function cfgOf(){var c={};Object.keys(S).forEach(function(k){if(k!=='entries')c[k]=S[k]});return c}
function partsOf(){
  var p={cfg:JSON.stringify(cfgOf())},by={};
  S.entries.forEach(function(x){var m=x.date.slice(0,7);(by[m]=by[m]||[]).push(x)});
  Object.keys(by).forEach(function(m){p['e_'+m]=JSON.stringify(by[m])});
  Object.keys(known).forEach(function(id){if(id!=='cfg'&&p[id]===undefined)p[id]='[]'});
  return p;
}
function syncSoon(){if(!DB||!initDone)return;clearTimeout(pushT);pushT=setTimeout(push,700);syncState='wait';renderBadge()}
async function push(){
  if(pushing){pushT=setTimeout(push,700);return}
  pushing=true;
  try{
    var p=partsOf(),ids=Object.keys(p);
    for(var i=0;i<ids.length;i++){
      var id=ids[i];if(known[id]===p[id])continue;
      var prev=known[id];known[id]=p[id];
      try{await COL.doc(id).set({j:p[id]})}catch(e){if(prev===undefined)delete known[id];else known[id]=prev;throw e}
    }
    syncState='ok';
  }catch(e){syncState=(e&&e.code==='invalid_argument')?'ro':'err'}
  pushing=false;renderBadge();
}
function applyRemote(snap){
  var docs={};snap.docs.forEach(function(d){var x=d.data();if(x&&typeof x.j==='string')docs[d.id]=x.j});
  var ids=Object.keys(docs);
  if(!ids.length){
    if(snap.metadata&&snap.metadata.fromCache)return;
    if(!initDone){initDone=true;push()}
    return;
  }
  var changed=ids.some(function(id){return known[id]!==docs[id]});
  var first=!initDone;initDone=true;
  if(!changed||pushing){if(first){syncState='ok';renderBadge()}return}
  try{
    var cfg=docs.cfg?JSON.parse(docs.cfg):null,ents=[];
    ids.forEach(function(id){if(id.slice(0,2)==='e_')ents=ents.concat(JSON.parse(docs[id]))});
    if(!cfg)return;
    if(first){try{localStorage.setItem(KEY+'-pre-sync',JSON.stringify(S))}catch(e){}}
    cfg.entries=ents;
    S=migrate(cfg);known={};ids.forEach(function(id){known[id]=docs[id]});
    saveLocal();syncState='ok';
    if(sh)pendingR=true;else render();
  }catch(e){syncState='err'}
  renderBadge();
}
(function(){
  try{
    if(!window.claude||!window.claude.use)return;
    Promise.all([window.claude.use('user'),window.claude.use('db')]).then(async function(r){
      var u=r[0],d=r[1];if(!u||!d)return;
      UID=await u.id();if(!UID)return;
      DB=d;COL=d.collection('data/users/'+UID);syncState='wait';render();
      COL.onSnapshot(applyRemote,function(){syncState='err';renderBadge()});
    }).catch(function(){});
  }catch(e){}
})();

render();
})();
</script>
