<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>считалОчка</title>
<meta name="theme-color" content="#6a45e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="считалОчка">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one narrow column, wallet on top, tab bar at the bottom, entry form as a bottom sheet. */
:root{
  --bg:#f2f0f7; --surface:#ffffff; --surface2:#e9e6f2; --ink:#1d1830; --muted:#6a6385; --line:#dcd7ea;
  --accent:#6a45e8; --accent-ink:#ffffff; --in:#0d7f58; --out:#cf3f3a; --warn:#a96a0c; --warn-bg:#fbf0d9; --bad-bg:#fbe3e1; --good-bg:#dff3e9; --gold:#d99a1a;
  --font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14111c; --surface:#1e1a29; --surface2:#292335; --ink:#f1ecf9; --muted:#a99bc2; --line:#34293f;
    --accent:#a98bff; --accent-ink:#17102b; --in:#6fdca6; --out:#ff8080; --warn:#f0c674; --warn-bg:#3a2f18; --bad-bg:#3b1f24; --good-bg:#1b3328; --gold:#f0c674; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14111c; --surface:#1e1a29; --surface2:#292335; --ink:#f1ecf9; --muted:#a99bc2; --line:#34293f;
  --accent:#a98bff; --accent-ink:#17102b; --in:#6fdca6; --out:#ff8080; --warn:#f0c674; --warn-bg:#3a2f18; --bad-bg:#3b1f24; --good-bg:#1b3328; --gold:#f0c674; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:0 96px;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:16px}
h1,h2,h3,p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
.ico{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.ico svg{width:20px;height:20px}
.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hero{background:var(--accent);color:var(--accent-ink);gap:6px}
.hero .lbl{font-size:13px;opacity:.8}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:8px}
.drag{flex:none;align-self:stretch;display:flex;align-items:center;padding:0 10px 0 2px;margin-left:-4px;color:var(--muted);font-size:20px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.row.dragging{position:relative;z-index:5;background:var(--surface2);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.amt.skip{color:#5b8def}
.stat .fine{display:block;margin-top:2px;line-height:1.3}
.stat{background:rgba(255,255,255,.14);border-radius:12px;padding:10px;min-width:0}
.stat .lbl{font-size:11px;opacity:.85}
.stat b{display:block;font-size:15px;font-weight:700;margin-top:2px;white-space:nowrap}
.note{border-radius:14px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.note b{font-size:14px}
.note.good{background:var(--good-bg)} .note.warn{background:var(--warn-bg)} .note.bad{background:var(--bad-bg)}
.note.info{background:var(--surface);}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted)}
.amt{font-weight:700;white-space:nowrap}
.amt.in{color:var(--in)} .amt.out{color:var(--out)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.list{display:flex;flex-direction:column}
.list .row{padding-block:10px;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.list .row:first-child{border-top:0}
.daytitle{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600;padding:4px 2px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav b{font-size:16px;text-transform:capitalize}
.nav button{width:40px;height:40px;border-radius:12px;background:var(--surface);font-size:18px;color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 16px;font-weight:700}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--out)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.split i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-size:34px;font-weight:800;line-height:1}
.empty{color:var(--muted);font-size:14px;padding-block:8px}
svg text{fill:var(--muted);font-family:var(--font)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--accent)}
.tabs .plus{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);margin:-18px auto 0;display:grid;place-items:center;box-shadow:0 4px 14px rgba(106,69,232,.4)}
.tabs .plus svg{width:26px;height:26px}
.ov{position:fixed;inset:0;background:rgba(10,6,20,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.ov[hidden],[hidden]{display:none!important}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:18px;font-weight:800}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.f input.amount{font-size:26px;font-weight:800}
.f textarea{min-height:70px;resize:vertical;font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-block;background:var(--surface2);border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;color:var(--muted)}
.chip.ok{background:var(--good-bg);color:var(--in)}
.chip.late{background:var(--warn-bg);color:var(--warn)}
.sum3{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:6px 10px;font-size:13px;align-items:center}
.sum3 .h{color:var(--muted);font-size:11.5px;font-weight:600}
.sum3 .r{text-align:right;white-space:nowrap}
.fine{font-size:12.5px;color:var(--muted)}
.bigsum{font-size:30px;font-weight:800;letter-spacing:-.02em}
.card.game{flex-direction:row;align-items:center;text-align:left;width:100%;gap:14px}
.petbox{flex:none;width:72px;height:72px;display:block}
.gi{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.gt{font-weight:700}
.game .bar{display:block}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.stats3 div{display:flex;flex-direction:column;gap:2px}
.stats3 b{font-size:24px;font-weight:800}
.q{display:flex;flex-direction:column;gap:8px;padding-block:10px;border-top:1px solid var(--line)}
.card h2 + .q{border-top:0}
.q.done .t{color:var(--muted);text-decoration:line-through}
.achs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ach{display:flex;flex-direction:column;gap:2px;background:var(--surface2);border-radius:14px;padding:12px;opacity:.55}
.ach.on{opacity:1}
.ach b{font-size:14px;overflow-wrap:anywhere}
.medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--muted);margin-bottom:4px}
.ach.on .medal{background:var(--gold);color:#fff}
.toast{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));max-width:380px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;z-index:20;display:flex;flex-direction:column;gap:2px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast .sub{font-weight:500;font-size:13px}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.toast.show{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}}

function parseLoose(txt){ // терпимо к тексту из Телеграма: заголовки сообщений, переносы, разрезанные куски
  txt=String(txt||'').replace(/^\uFEFF/,'').trim();
  try{return JSON.parse(txt)}catch(e){}
  var t0=txt.replace(/^[^\n{}\[\]"]{0,80}\[\d{1,2}[.\/]\d{1,2}[.\/]\d{2,4}[ ,]+\d{1,2}:\d{2}(:\d{2})?\]\s*$/gm,'');
  // Телеграм режет длинный текст по пробелу и съедает его: сначала склеиваем через пробел, потом без
  var tries=[t0.replace(/\s*[\r\n\u2028\u2029]+\s*/g,' '),t0.replace(/[\r\n\u2028\u2029]+/g,'')];
  for(var i=0;i<tries.length;i++){var t=tries[i],a=t.indexOf('{'),b=t.lastIndexOf('}'),a2=t.indexOf('[');
    if(a2>=0&&(a<0||a2<a)){a=a2;b=t.lastIndexOf(']')}
    if(a<0||b<a)continue;
    try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  throw 0;
}
function backupErr(txt){txt=String(txt||'').trim();
  if(!txt)return 'Поле пустое. Вставьте текст копии.';
  if(txt.charAt(0)!=='{'&&txt.indexOf('{"v"')<0)return 'Это не начало копии: текст должен начинаться с {"v". Телеграм делит длинный текст на несколько сообщений — выделите их все (зажмите первое, потом отметьте остальные), скопируйте вместе и вставьте.';
  return 'Копия неполная: похоже, вставлена только часть. Телеграм делит длинный текст на несколько сообщений — выделите их все, скопируйте вместе и вставьте. Надёжнее — файлом через «Восстановить из файла».'}

  var accIds={};(o.accounts||[]).forEach(function(a){accIds[a.id]=1});
  var main=(o.accounts||[]).filter(function(a){return a.type==='main'})[0];
  extra.forEach(function(e){if(e.acc&&!accIds[e.acc])e.acc=main?main.id:e.acc;if(e.type==='t'&&(!accIds[e.from]||!accIds[e.to]))e.acc=main?main.id:e.acc});
  o.entries=o.entries.concat(extra.filter(function(e){return e.type!=='t'||(accIds[e.from]&&accIds[e.to])}));

}

/* сжатая копия текстом: SCH1: + base64(gzip(json)) — короче в несколько раз, Телеграм её не портит */
function packBackup(json){
  if(!window.CompressionStream)return Promise.resolve(json);
  try{var st=new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
    return new Response(st).arrayBuffer().then(function(buf){var b=new Uint8Array(buf),bin='';for(var i=0;i<b.length;i+=8192)bin+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return 'SCH1:'+btoa(bin)},function(){return json})}catch(e){return Promise.resolve(json)}}
function readBackupText(txt){txt=String(txt||'');var k=txt.indexOf('SCH1:');
  if(k<0)return new Promise(function(ok){ok(parseLoose(txt))});
  var b64=txt.slice(k+5).replace(/[^A-Za-z0-9+\/=]/g,'');
  if(!window.DecompressionStream)return Promise.reject(new Error('old'));
  try{var bin=atob(b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    var st=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(st).text().then(function(t){return JSON.parse(t)})}catch(e){return Promise.reject(e)}}
function markBackup(){S.lastBackup=T;save()}
function doDownload(){
  var json=JSON.stringify(S),name='schitalochka-'+T+'.json';
  try{
    var blob=new Blob([json],{type:'application/json'});
    if(navigator.canShare&&window.File){var f=new File([blob],name,{type:'text/plain'});if(navigator.canShare({files:[f]})){navigator.share({files:[f]}).then(markBackup,function(e){
      if(e&&e.name==='AbortError')return; // сама закрыла окно
      var r=dlBlob(blob,name),m=document.getElementById('s_msg0');if(m){m.textContent=r?'Файл сохранён, ищите в «Загрузках».':'Не получилось сохранить файл. Нажмите «Копировать текст».';m.hidden=false}});return 'share'}}
    return dlBlob(blob,name)?'dl':'err';
  }catch(e){return 'err'}
}
function dlBlob(blob,name){
  try{
    var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);markBackup();return true;
  }catch(e){return false}
}
function planStats(){

function plannedItems(from,days){

    S.incomes.forEach(function(r){var d=planned(ym,r.day);if(d>=from&&d<=end&&!doneFor('iid',r.id,ym))out.push({date:d,kind:'in',name:r.name,amt:r.amt,id:r.id,ym:ym})});
    if(S.planFrom)S.rules.forEach(function(r){
      if(!accById(r.acc)||ym<planFromYM()||ruleDone(r,ym)||ruleSkipped(r.day,ym))return;
      var d=planned(ym,r.day);if(d<S.planFrom)return;if(d<from)d=from;

function health(ym){

  var inc=sum(monthEntries(ym),'i'),tot=0,by={need:0,mind:0,imp:0};
  ex.forEach(function(x){tot+=x.amt;by[x.cls||'need']+=x.amt});
  if(!tot)return null;

  if(inc>0&&tot>inc)s-=Math.min(30,(tot/inc-1)*60);

function goalPace(a){ // средний чистый приток за последние 3 месяца

  return net/3;
}

/* ---------- разбор месяца ---------- */
var rvCands=[];
function reviewCard(){
  var ym=vym,curYM=T.slice(0,7);if(ym>curYM)return '';
  var cur=ym===curYM,a=ym.split('-'),n=dim(+a[0],+a[1]-1),d=cur?parseInt(T.slice(8),10):n,left=n-d;
  function ex(m,upto){return S.entries.filter(function(x){return x.type==='e'&&!x.skip&&!x.demo&&x.date.slice(0,7)===m&&(!upto||parseInt(x.date.slice(8),10)<=upto)})}
  function tot(l){return l.reduce(function(s,x){return s+x.amt},0)}
  function byCat(l){var o={};l.forEach(function(x){o[x.cat]=(o[x.cat]||0)+x.amt});return o}
  function cname(k){return (CMAP[k]||CMAP.other).name}
  function ccol(k){return (CMAP[k]||CMAP.other).color}
  function pct(x){return Math.round(x*100)+'%'}
  var list=ex(ym),spent=tot(list);
  var prev=[];for(var k=1;k<=6&&prev.length<3;k++){var pm=nextYM(ym,-k);if(ex(pm).length)prev.push(pm)}
  var H='<div class="card"><h2>Разбор месяца</h2>';
  if(!list.length&&!prev.length)return H+'<p class="empty">Появится, когда будут записи трат.</p></div>';
  var big=list.filter(function(x){return x.amt>=3000&&x.amt>=spent*0.15}),bigSum=tot(big);
  var fc=cur&&d>0?spent+((spent-bigSum)/d)*left:spent;
  var base=null,baseTo=null,baseCat={};
  if(prev.length){
    base=prev.reduce(function(s,m){return s+tot(ex(m))},0)/prev.length;
    baseTo=prev.reduce(function(s,m){return s+tot(ex(m,cur?d:0))},0)/prev.length;
    prev.forEach(function(m){var c=byCat(ex(m,cur?d:0));Object.keys(c).forEach(function(kk){baseCat[kk]=(baseCat[kk]||0)+c[kk]/prev.length})});
  }
  var curCat=byCat(list),tips=[];
  /* 1. итог или прогноз */
  var cmp='';
  if(base!==null&&base>0){
    var ref=cur?fc:spent,df=ref-base,rel=df/base;
    cmp=Math.abs(rel)<0.05?'Примерно как обычно ('+money(base)+' в среднем за '+prev.length+' мес.).'
      :(df>0?'На '+money(df)+' больше':'На '+money(-df)+' меньше')+' обычного ('+money(base)+' в среднем за '+prev.length+' мес.), '+(df>0?'+':'−')+pct(Math.abs(rel))+'.';
  }else cmp='Сравнивать пока не с чем: сравнение появится, когда накопится хотя бы один прошлый месяц с записями.';
  H+='<div class="note '+(base&&(cur?fc:spent)>base*1.1?'warn':base&&(cur?fc:spent)<base*0.95?'good':'info')+'"><b>'+(cur?'Прогноз на месяц: около '+money(fc):'Итог месяца: '+money(spent))+'</b><span class="fine">'+
    (cur?'Потрачено '+money(spent)+' за '+d+' дн., осталось '+left+' дн.'+(bigSum?' Крупные разовые траты ('+money(bigSum)+') в прогнозе не повторяются.':'')+' ':'')+cmp+'</span></div>';
  /* 2. категории */
  var keys={};Object.keys(curCat).concat(Object.keys(baseCat)).forEach(function(kk){keys[kk]=1});
  var ch=Object.keys(keys).map(function(kk){var c=curCat[kk]||0,b=baseCat[kk]||0;return {k:kk,c:c,b:b,df:c-b}});
  var up=ch.filter(function(x){return x.df>=1000&&(x.b===0||x.df/x.b>=0.3)}).sort(function(p,q){return q.df-p.df}).slice(0,3);
  var down=ch.filter(function(x){return x.df<=-1000&&x.b>0&&-x.df/x.b>=0.3}).sort(function(p,q){return p.df-q.df}).slice(0,2);
  if(prev.length&&(up.length||down.length)){
    H+='<div class="fine" style="font-weight:700;margin-top:4px">Что изменилось'+(cur?' к '+d+'-му числу':'')+' по сравнению с обычным</div><div class="list">'+
      up.concat(down).map(function(x){return '<div class="row"><span class="dot" style="background:'+ccol(x.k)+'"></span><div class="grow"><div class="t">'+esc(cname(x.k))+'</div><div class="s">'+money(x.c)+' · обычно '+money(x.b)+'</div></div><span class="amt '+(x.df>0?'out':'in')+'">'+(x.df>0?'+':'−')+money(Math.abs(x.df))+'</span></div>'}).join('')+'</div>';
  }
  /* 3. необычные траты */
  var from=iso(addDays(parse(ym+'-01'),-120)),start=ym+'-01';
  var odd=list.filter(function(x){
    var h=S.entries.filter(function(y){return y.type==='e'&&!y.demo&&!y.skip&&y.cat===x.cat&&y.date>=from&&y.date<start}).map(function(y){return y.amt}).sort(function(p,q){return p-q});
    if(h.length>=3){var med=h[Math.floor(h.length/2)];return x.amt>=Math.max(3*med,2000)}
    return x.amt>=Math.max(5000,spent*0.2);
  }).sort(function(p,q){return q.amt-p.amt}).slice(0,3);
  if(odd.length){
    H+='<div class="fine" style="font-weight:700;margin-top:4px">Необычно крупные траты</div><div class="list">'+odd.map(function(x){return '<div class="row"><span class="dot" style="background:'+ccol(x.cat)+'"></span><div class="grow"><div class="t">'+esc(x.note||cname(x.cat))+'</div><div class="s">'+esc(cname(x.cat))+' · '+dlabel(x.date)+'</div></div><span class="amt out">'+money(x.amt)+'</span></div>'}).join('')+'</div>';
  }
  /* 4. регулярные, но не в плане */
  rvCands=[];
  var grp={},months=[ym,nextYM(ym,-1),nextYM(ym,-2),nextYM(ym,-3)];
  S.entries.forEach(function(x){if(x.type!=='e'||x.demo||x.rid||!x.note||months.indexOf(x.date.slice(0,7))<0)return;var kk=norm(x.note);(grp[kk]=grp[kk]||[]).push(x)});
  var planned=(S.recur||[]).map(function(r){return norm(r.name)});
  Object.keys(grp).forEach(function(kk){
    var g=grp[kk],ms={};g.forEach(function(x){ms[x.date.slice(0,7)]=1});
    if(Object.keys(ms).length<2||g.length>Object.keys(ms).length*2)return;
    if(!(ms[ym]||ms[nextYM(ym,-1)]))return;
    if(planned.some(function(p){return p&&(p===kk||kk.indexOf(p)>=0||p.indexOf(kk)>=0)}))return;
    var am=g.map(function(x){return x.amt}).sort(function(p,q){return p-q}),med=am[Math.floor(am.length/2)];
    if(med<100||am.some(function(v){return Math.abs(v-med)>med*0.15}))return;
    var last=g.slice().sort(function(p,q){return p.date<q.date?1:-1})[0];
    rvCands.push({name:last.note,amt:Math.round(med),day:parseInt(last.date.slice(8),10),cat:last.cat});
  });
  rvCands.sort(function(p,q){return q.amt-p.amt});rvCands=rvCands.slice(0,3);
  if(rvCands.length){
    H+='<div class="fine" style="font-weight:700;margin-top:4px">Похоже на регулярные платежи</div><div class="list">'+rvCands.map(function(c,i){return '<div class="row"><div class="grow"><div class="t">'+esc(c.name)+'</div><div class="s">около '+money(c.amt)+' каждый месяц, примерно '+c.day+'-го</div></div>'+(S.simple?'':'<button class="btn ghost sm" style="flex:none" data-a="rvAddRec" data-id="'+i+'">В платежи</button>')+'</div>'}).join('')+'</div>';
  }
  /* 5. копилки */
  function saved(m){return S.entries.filter(function(x){if(x.type!=='t'||x.date.slice(0,7)!==m)return false;var ta=accById(x.to);return ta&&ta.type==='save'}).reduce(function(s,x){return s+x.amt},0)}
  var sv=saved(ym),svb=prev.length?prev.reduce(function(s,m){return s+saved(m)},0)/prev.length:0;
  if(sv||svb)H+='<div class="row" style="margin-top:4px"><div class="grow"><div class="t">Отложено в копилки</div><div class="s">'+(svb?'обычно '+money(svb)+' в месяц':'в этом месяце')+'</div></div><span class="amt in">'+money(sv)+'</span></div>';
  /* 6. подсказки */
  if(cur&&base&&left>0){var rem=base-spent;
    tips.push(rem>0?'Чтобы уложиться в свой обычный месяц ('+money(base)+'), до конца месяца тратить не больше '+money(rem/left)+' в день.':'Уже потрачено больше, чем в обычный месяц ('+money(base)+')'+(bigSum?', в том числе из-за крупных покупок на '+money(bigSum):'')+'. До конца месяца лучше оставить только обязательное.')}
  var oddCat={};odd.forEach(function(x){oddCat[x.cat]=(oddCat[x.cat]||0)+x.amt});var tu=up.filter(function(x){return x.c-(oddCat[x.k]||0)-x.b>=1000})[0];
  if(tu&&prev.length)tips.push('Сильнее всего выросли «'+cname(tu.k)+'»: +'+money(tu.df)+' к обычному. Загляни в эти траты в «Истории», что из них можно было пропустить.');
  var eat=(curCat.cafe||0)+(curCat.taxi||0),eatB=(baseCat.cafe||0)+(baseCat.taxi||0),bTo=baseTo||0;
  if(spent>3000&&eat/spent>0.2){var sh2=eat/spent,shB=bTo?eatB/bTo:0;
    tips.push('Кафе, доставка и такси — '+pct(sh2)+' трат'+(shB&&shB<sh2-0.03?' (обычно '+pct(shB)+'). Вернуть к обычной доле — это примерно '+money(eat-shB*spent)+' за месяц.':'. Это первое место, где обычно получается сэкономить без потерь.'))}
  if(!S.simple){var imp=list.filter(function(x){return x.cls==='imp'}).reduce(function(s,x){return s+x.amt},0);
    if(spent>0&&imp/spent>0.15)tips.push('Импульсивные покупки — '+pct(imp/spent)+' трат ('+money(imp)+'). Попробуй правило суток: хочешь что-то незапланированное — подожди день.')}
  if(rvCands.length&&!S.simple)tips.push('Добавь регулярные траты в «Платежи», тогда «доступно в день» и прогноз будут их учитывать заранее.');
  if(!tips.length&&base)tips.push('Траты в пределах твоей нормы, всё ровно. Так держать!');
  if(tips.length)H+='<div class="fine" style="font-weight:700;margin-top:4px">Подсказки</div><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px">'+tips.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul>';
  H+='<p class="fine">Считается по твоим записям. Возвраты и записи с галочкой «не считать в тратах» не учитываются. Для подробного разбора отправь выгрузку Claude.</p>';

}

var BK={};
BK.num=function(s){s=String(s).replace(/[\s\u00a0\u202f]/g,'').replace(/RUR|RUB|₽/g,'').replace(',','.');var v=parseFloat(s);return isNaN(v)?null:v};
BK.date=function(s){var m=String(s).match(/^(\d\d)\.(\d\d)\.(\d\d|\d{4})$/);if(!m)return null;var y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2]+'-'+m[1]};
BK.isDate=function(s){return /^\d\d\.\d\d\.(\d\d|\d{4})$/.test(String(s).trim())};
BK.isMoney=function(s){return /^[+\-−]?\s?[\d\s\u00a0]+[.,]\d\d(\s?(RUR|RUB|₽))?$/.test(String(s).trim())};
BK.lines=function(items){
  var ls=[],sorted=items.slice().sort(function(a,b){return a.p-b.p||a.y-b.y||a.x-b.x});
  sorted.forEach(function(it){var l=ls[ls.length-1];
    if(l&&l.p===it.p&&Math.abs(l.y-it.y)<=2.5)l.items.push(it);else ls.push({p:it.p,y:it.y,items:[it]})});
  ls.forEach(function(l){l.items.sort(function(a,b){return a.x-b.x});l.text=l.items.map(function(i){return i.s.trim()}).join(' ')});
  return ls;
};
BK.clean=function(s){return String(s||'').replace(/\s+/g,' ').trim()};
BK.phone=function(s){s=String(s);var t=s.match(/тел\.?\s*\+?7?\s*(\d{10})\b/);if(t)return '7'+t[1];var m=s.match(/(?:^|[^A-Za-z0-9])(\+7|8)[\s(\-]*(\d{3})[\s)\-]*(\d{3})[\s\-]*(\d{2})[\s\-]*(\d{2})(?!\d)/);return m?'7'+m[2]+m[3]+m[4]+m[5]:''};
BK.fmtPhone=function(p){return p&&p.length===11?'+7 '+p.slice(1,4)+' '+p.slice(4,7)+'-'+p.slice(7,9)+'-'+p.slice(9):p};
BK.ownerFrom=function(text){var m=text.match(/(?:Клиент|Владелец счёта|Кому:)\s*([А-ЯЁ][А-ЯЁа-яё\-]+\s+[А-ЯЁ][А-ЯЁа-яё\-]+\s+[А-ЯЁ][А-ЯЁа-яё\-]+)/)||text.match(/\b([А-ЯЁ]{2,}\s+[А-ЯЁ]{2,}\s+[А-ЯЁ]{3,}(?:ВНА|ВИЧ|ИЧНА|ЧНА|ЬИЧ|ОГЛЫ|КЫЗЫ))\b/);return m?m[1]:''};
BK.mcc=function(s){var c=[],m=String(s).match(/MCC\s?(\d{4})/);if(m)c.push(m[1]);(String(s).match(/\b\d{4}\b/g)||[]).forEach(function(x){c.push(x)});for(var i=0;i<c.length;i++)if(BK.mccCat(c[i]))return c[i];return c[0]||''};
BK.detect=function(text){
  if(/Код операции/.test(text)&&/АЛЬФА-БАНК|Дата проводки/.test(text))return 'alfa';
  if(/СберБанк|sberbank/i.test(text))return 'sber';
  if(/Счет-выписка/.test(text)&&/Назначение платежа/.test(text))return 'otp';
  if(/Выписка по договору/.test(text)&&/Дата обработки|обработки/.test(text)&&/₽/.test(text))return 'tbank';
  if(/Сумма операции в валюте счета\/карты/.test(text)||(/Наименование/.test(text)&&/получателя\/|Отправителя/.test(text)))return 'vtb';
  return '';
};

BK.below=function(ls,isAnchor,isStop){
  var out=[],cur=null;
  ls.forEach(function(l){
    if(isAnchor(l)){cur={a:l,more:[]};out.push(cur);return}
    if(!cur)return;
    if(isStop(l)){cur.stopped=true;return}
    if(cur.stopped&&l.p===cur.a.p)return;
    cur.more.push(l);
  });
  return out;
};
BK.alfa=function(items){

  var rows=BK.below(ls,function(l){var f=l.items[0];return (BK.isDate(f.s)||f.s.trim()==='HOLD')&&f.x<60&&l.items.some(function(i){return i.x>480&&/RUR$/.test(i.s.trim())})},function(l){return stop(l)});

    var it=r.a.items,amtIt=it.filter(function(i){return i.x>480&&/RUR$/.test(i.s.trim())})[0],code=(it[1]&&it[1].x<185?it[1].s.trim():'');

      hm=BK.clean(hm.replace(/-\s*\S*$/,'').replace(/\b\d{3,}\b/g,''));

BK.vtb=function(items){
  var ls=BK.lines(items),ops=[];
  var anchors=ls.filter(function(l){return l.items.length>=3&&BK.isDate(l.items[0].s)&&l.items[0].x<60&&l.items[1]&&BK.isDate(l.items[1].s)});
  function assign(colItems){ // блоки текста по колонке → ближайший якорь по центру блока
    var by={};colItems.sort(function(a,b){return a.p-b.p||a.y-b.y||a.x-b.x});
    var blocks=[],cur=null;
    colItems.forEach(function(i){if(cur&&cur.p===i.p&&i.y-cur.last<=10){cur.items.push(i);cur.last=i.y}else{cur={p:i.p,first:i.y,last:i.y,items:[i]};blocks.push(cur)}});
    blocks.forEach(function(b){var c=(b.first+b.last)/2,best=null,bd=1e9;anchors.forEach(function(a,ai){if(a.p!==b.p)return;var d=Math.abs(a.y-c);if(d<bd){bd=d;best=ai}});
      if(best!==null&&bd<40){(by[best]=by[best]||[]).push(b.items.map(function(i){return i.s}).join(' '))}});
    return by;
  }
  var top=anchors.length?anchors[0]:null;
  var body=items.filter(function(i){return !top||i.p>top.p||i.y>=top.y-30});
  var dcol=assign(body.filter(function(i){return i.x>=380&&i.x<505&&!/^Описание операции$|^Наименование$/.test(i.s.trim())}));
  var rcol=assign(body.filter(function(i){return i.x>=505&&!/получателя\/|Отправителя|Наименование/.test(i.s)}));
  var seen={};
  anchors.forEach(function(a,ai){
    var money=a.items.filter(function(i){return /RUB/.test(i.s)&&i.x<380});
    if(money.length<3)return;
    var inc=BK.num(money[1].s),exp=BK.num(money[2].s),v=inc>0?inc:Math.abs(exp),dir=inc>0?'in':'out';
    var desc=BK.clean((dcol[ai]||[]).join(' ')),who=BK.clean((rcol[ai]||[]).join(' '));
    var sig=BK.date(a.items[0].s)+'_'+BK.date(a.items[1].s)+'_'+dir+v;seen[sig]=(seen[sig]||0)+1;
    var op={bank:'vtb',key:'vtb_'+sig+'_'+seen[sig],date:BK.date(a.items[0].s),amt:v,dir:dir,raw:desc+' '+who,desc:desc,who:who};
    if(/Оплата товаров и услуг/.test(desc)){op.kind='buy';var m=desc.replace(/^.*Оплата товаров и услуг\.\s*/,'');m=m.split(/\.\s*РОССИЯ|\.\s*RUSSIA/)[0];op.merchant=BK.clean(m.replace(/\*+\d*\*?/g,' ').replace(/\b\d{3,}\b/g,''))}
    else if(/между своими/.test(desc)){op.kind='own';op.desc='Перевод между своими счетами'}
    else if(/СБП|Перевод/.test(desc)){op.kind='sbp';op.phone=BK.phone(desc);op.desc=(dir==='out'?'Перевод · ':'Поступление · ')+(who||'СБП')}
    else if(/Возврат/i.test(desc)){op.kind='refund'}
    else if(/зарплат|Заработная/i.test(desc)){op.kind='salary'}
    else op.kind='buy',op.merchant=desc;
    ops.push(op);
  });
  return ops;
};
BK.otp=function(items){
  var ls=BK.lines(items),ops=[],n=1,i=0;
  var lh=12.75;
  while(i<ls.length){
    var l=ls[i];
    if(l.text===String(n)&&ls[i+1]&&BK.isDate(ls[i+1].text)){
      var dateL=ls[i+1],opL=ls[i+2],j=i+3,amtL=null;
      while(j<ls.length&&!BK.isMoney(ls[j].text)&&j<i+6)j++;
      amtL=BK.isMoney(ls[j]&&ls[j].text)?ls[j]:null;
      var desc=[],k=amtL?j+1:i+3;
      var stopD=false;while(k<ls.length&&!(ls[k].text===String(n+1)&&ls[k+1]&&BK.isDate(ls[k+1].text))){if(/^\d+$/.test(ls[k].text)||BK.isMoney(ls[k].text)||/С уважением|Директор|Выписка выдана/.test(ls[k].text))stopD=true;if(!stopD)desc.push(ls[k].text);k++}
      var name=opL?opL.text:'',v=amtL?Math.abs(BK.num(amtL.text)):0,dir;
      if(amtL&&opL&&amtL.p===opL.p)dir=(amtL.y-opL.y)>lh*1.5?'in':'out';
      else dir=/Пополнение|Зарплата|Поступление|Возврат|Начисление/i.test(name)?'in':'out';
      var d=BK.clean(desc.join(' ')),uv=(d.match(/ув\.\s*№\s*([A-Z0-9]+)/)||[])[1];
      var op={bank:'otp',key:'otp_'+(uv||BK.date(dateL.text)+'_'+name+'_'+dir+v),date:BK.date(dateL.text),amt:v,dir:dir,raw:name+' '+d,desc:name};
      if(/^Покупка/.test(name)){op.kind='buy';op.merchant=BK.clean(name.replace(/^Покупка\s*/,''))||'Покупка'}
      else if(/Зарплата|ЗАРПЛАТ|КОМПЕНСАЦ/i.test(name+' '+d)){op.kind='salary';op.desc=/КОМПЕНСАЦ/i.test(d)?'Компенсация':'Зарплата'}
      else if(/наличн/i.test(d)){op.kind='cash';op.desc='Наличные'}
      else if(/Перевод|Поступление средств|Пополнение счета/i.test(name+' '+d)){op.kind='sbp';op.phone=BK.phone(d);var w=(d.match(/(?:получатель|отправитель):\s*([^,]+)/)||[])[1];op.who=w?BK.clean(w):'';op.desc=(dir==='out'?'Перевод · ':'Поступление · ')+(op.who||BK.fmtPhone(op.phone)||name)}
      else if(/Возврат/i.test(name)){op.kind='refund'}
      else {op.kind='buy';op.merchant=name}
      if(v>0)ops.push(op);
      n++;i=k;continue;
    }
    i++;
  }
  return ops;
};

BK.parse=function(items){

  var ops=BK[bank](items);
  return {bank:bank,name:BK.names[bank],owner:BK.ownerFrom(text)||(bank==='vtb'||bank==='tbank'?BK.clean(items.slice().sort(function(a,b){return a.p-b.p||a.y-b.y})[0].s):''),ops:ops};
};

function bkItems(buf){

    for(var p=1;p<=doc.numPages;p++)(function(p){chain=chain.then(function(){return doc.getPage(p).then(function(pg){var vp=pg.getViewport({scale:1});return pg.getTextContent().then(function(tc){

/* ---------- игра: награда за результат, а не за количество записей ---------- */
var G2TITLES=['Новичок','Монетка','Рублик','Счетовод','Экономист','Финансист','Казначей','Мастер бюджета','Хранитель запасов','Легенда'];
function g2SavePlan(){var c=S.planCalc;if(c&&+c.save>0)return +c.save;var r=0;(S.rules||[]).forEach(function(x){r+=+x.amt||0});return r}

function g2(){
  var lim=dayLimit(),PD=petDay(),ns={};(S.noSpend||[]).forEach(function(d){ns[d]=1});
  var by={},first=null;
  S.entries.forEach(function(x){if(x.demo||x.date>PD)return;(by[x.date]=by[x.date]||[]).push(x);if(!first||x.date<first)first=x.date});
  (S.noSpend||[]).forEach(function(d){if(d<=PD&&(!first||d<first))first=d});
  var g={lim:lim,stars:0,streak:0,best:0,good:0,nospend:0,days:[],saved:0,weeks:0,months:0,savedMonths:0};
  if(!lim||!first)return g2fin(g);
  function net(l){l=life(l);return l.filter(function(x){return x.type==='e'&&!x.skip}).reduce(function(a,x){return a+x.amt},0)-refunds(l)}
  var n=diffDays(first,PD),run=0,mNet=0,mDays=0,mKnown=0,curM='',wNet=0,wKnown=0,wDays=0,curW='',ym0=PD.slice(0,7);
  function closeMonth(m){if(!m||m===ym0)return;var a=m.split('-'),dd=dim(+a[0],+a[1]-1);
    if(mKnown>=15&&mNet<=lim*dd){g.stars+=200;g.months++}
    var sp=g2SavePlan();if(sp>0&&g2Saved(m)>=sp){g.stars+=100;g.savedMonths++}}
  function closeWeek(){if(wKnown>=4&&wDays===7&&wNet<=lim*7){g.stars+=50;g.weeks++}}
  for(var i=0;i<n;i++){ // только завершённые дни, сегодняшний ещё идёт
    var d=iso(addDays(parse(first),i)),l=by[d]||[],m=d.slice(0,7),dt=parse(d),wk=iso(addDays(dt,-((dt.getDay()+6)%7)));
    if(m!==curM){closeMonth(curM);curM=m;mNet=0;mDays=0;mKnown=0}
    if(wk!==curW){if(curW)closeWeek();curW=wk;wNet=0;wKnown=0;wDays=0}
    var v=net(l),st;
    if(ns[d]&&v<=0)st='nospend';else if(!l.length)st='unknown';else if(v<=0)st='nospend';else if(v<=lim)st='good';else st='over';
    mDays++;wDays++;
    if(st!=='unknown'){mKnown++;wKnown++;mNet+=Math.max(0,v);wNet+=Math.max(0,v)}
    if(st==='over'&&mNet<=lim*mDays)st='oneoff';
    if(st==='good'){g.stars+=10;g.good++;run++}
    else if(st==='nospend'){g.stars+=20;g.nospend++;run++}
    else if(st==='over')run=0;
    if((st==='good'||st==='nospend')&&run>0&&run%7===0)g.stars+=30;
    if(run>g.best)g.best=run;
    if(m===ym0){g.saved+=st==='unknown'?0:lim-Math.max(0,v)}
    g.days.push({d:d,st:st});
  }
  closeMonth(curM===ym0?'':curM);
  if(curW&&diffDays(curW,PD)>=7)closeWeek();
  g.streak=run;
  return g2fin(g);
}
function g2fin(g){

   '<div class="f"><label for="a_start">'+(d.type==='debt'?'Долг сейчас, ₽':'Сколько там сейчас, ₽')+'</label><input id="a_start" inputmode="decimal" value="'+esc(d.start)+'" placeholder="0"></div>'+
   (d.type==='save'?'<div class="f"><label for="a_goal">Цель, ₽ (необязательно)</label><input id="a_goal" inputmode="decimal" value="'+esc(d.goal||'')+'" placeholder="Например, 100000"><span class="fine">Покажу, сколько осталось и когда наберётся при нынешнем темпе.</span></div>':'')+
   '<p class="fine" id="f_err" style="color:var(--out)" hidden></p>'+

   (sh.id?(sh.confirm?'<div class="btns"><button type="button" class="btn danger" data-a="delAcc">Точно удалить</button><button type="button" class="btn ghost" data-a="noDel">Не удалять</button></div>':'<button type="button" class="btn danger" data-a="askDel">Удалить</button>'):'')+

function helpSheet(){openSheet('<h3>Как пользоваться</h3><div class="help f" style="gap:8px"><details open><summary>С чего начать</summary><div class="hb"><ul><li>Сначала тут примеры. Посмотри, как всё выглядит, потом нажми «Очистить примеры» на главной.</li><li>Нажми «Поправить остаток» и впиши, сколько сейчас денег на карте. От этой суммы всё и считается.</li><li>Дальше просто записывай траты, когда тратишь.</li></ul></div></details><details><summary>Загрузить выписку из банка</summary><div class="hb"><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px"><li>В приложении банка закажи выписку по счёту или карте за нужный период в формате PDF и сохрани файл. Подходят Альфа-Банк, Сбер, ВТБ, ОТП и Т-Банк.</li><li>Здесь: шестерёнка → «Загрузить выписку из банка» → выбери файл (можно несколько сразу).</li><li>Появится список операций. Отмечено то, что пойдёт в траты и доходы: покупки, зарплата, возвраты. Переводы себе, наличные и уже загруженное пропущены.</li><li>Если в выписке есть переводы по номеру телефона, приложение спросит, чей номер: твой (пропускать), «делим траты» (его переводы тебе считаются возвратами, твои ему — расходами) или чужой. Ответ запоминается.</li><li>Проверь категории, сними лишнее и нажми «Добавить».</li></ol><p>Повторная загрузка той же выписки дублей не создаст. Если трату ты уже вносила руками, приложение заметит похожую запись и не будет отмечать её второй раз. Записи из выписки входят в траты и анализ, но остатки на счетах не меняют.</p></div></details><details><summary>План на день</summary><div class="hb"><p>План — сколько можно тратить в день на жизнь (еда, транспорт, кафе, мелочи), чтобы хватило на обязательное и получилось отложить. По нему монстрик понимает, всё ли в порядке.</p><p>Посчитать: «изменить» под монстриком или шестерёнка → «План трат на день». Впиши доход в месяц, обязательные платежи, сколько хочешь откладывать и редкие расходы в среднем за месяц. План = (доход − платежи − отложить − редкие) ÷ 30,4 дня, с округлением вниз до 50 ₽.</p><p>Если в расчёте есть обязательные платежи или редкие расходы, траты в соответствующих категориях (жильё, связь, подписки, одежда, красота и т. п.) не сравниваются с планом: они уже вычтены заранее. Список категорий можно поменять там же. В «Потрачено за месяц» они остаются.</p><p>Можно и просто вписать свою сумму в день.</p></div></details><details><summary>Делю с кем-то</summary><div class="hb"><p>Если платишь за двоих, при записи траты отметь «Делю с кем-то — жду, что вернут часть» и впиши сумму (по умолчанию половина). На главной появится «Ждёшь возвратов». Когда деньги придут, нажми «Пришло», и возврат запишется сам. Если вернуть не получится, нажми «не ждать».</p><p class="fine">Если возвраты попадают в приложение из банковской выписки, не нажимай «Пришло» — иначе возврат запишется дважды. Нажми «не ждать».</p></div></details><details><summary>Лимиты по категориям</summary><div class="hb"><p>«Анализ» → «По категориям» → «Лимиты». Впиши, сколько в месяц готов тратить, например, на кафе. Полоски станут зелёными, жёлтыми у края и красными, если лимит превышен. Лимиты видно и в «Прогрессе» на главной.</p></div></details><details><summary>Как записать трату</summary><div class="hb"><ul><li>Большая кнопка «+» внизу.</li><li>Впиши сумму и на что потратила, например «Пятёрочка» или «такси». Категория подберётся сама, её можно поменять. Если не угадала, выбери вручную, и в следующий раз приложение запомнит. Нет подходящей категории? В конце списка есть «＋ Своя категория…», а управлять своими категориями можно в настройках (шестерёнка).</li><li>Частые траты и категории появятся кнопками, чтобы записывать в одно касание.</li><li>Деньги вернули или пришли — переключи сверху на «Возврат», а зарплату и другие поступления записывай на вкладке «Доход».</li><li>Чужие деньги или обмен — поставь галочку «Не считать в тратах».</li><li>Ошиблась — открой запись в «Истории», поправь или удали.</li></ul></div></details><details><summary>Копилки и долги</summary><div class="hb"><ul><li>Копилка — деньги, отложенные на цель: отпуск, подушка, подарки. В «Свободные деньги» они не входят.</li><li>Завести: на главной «Новая копилка». Там же можно завести долг.</li><li>«Отложить» переводит деньги с карты в копилку, «Достать» — обратно.</li><li>Если платишь прямо из копилки, выбери её в записи в поле «Со счёта».</li></ul></div></details><details><summary>Прогресс и звёзды</summary><div class="hb"><p>Звёзды даются за результат, а не за количество записей: +20 за день без трат, +10 за день в плане, +30 за каждые 7 хороших дней подряд, +50 за неделю в плане, +200 за месяц в бюджете, +100 за месяц, когда отложено в копилки сколько запланировано.</p><p>Перерасход звёзды не отнимает. Дорогой день при нормальном среднем за месяц серию не прерывает. Дни без записей серию не рвут, а замораживают. С ростом уровня у монстрика появляются звёздочки (с 5-го) и корона (с 8-го).</p><p>Для игры нужен план на день.</p></div></details><details><summary>Монстрик</summary><div class="hb"><p>Питомец на главной. Нажми на него, чтобы выбрать другого монстрика (их тринадцать, а ещё можно загрузить свои картинки) и дать имя. Новый день для него начинается в 5 утра. С утра и до первой записи он рассказывает, как прошёл вчерашний день и сколько можно потратить сегодня. Если до часу ночи записей так и нет, он задрёмывает и ждёт, пока ты запишешь траты или отметишь «Сегодня без трат». Настроение зависит от того, как идут траты относительно плана в среднем за месяц: радуется, если с запасом, задумывается, если чуть выше, беспокоится, если заметно выше, и грустит, если сильно.</p></div></details><details><summary>История и анализ</summary><div class="hb"><ul><li>«История» — все записи по месяцам, стрелками можно листать.</li><li>«Анализ» — куда уходят деньги: по категориям и по дням.</li><li>Вверху «Анализа» — «Разбор месяца»: прогноз до конца месяца, сравнение с твоими обычными месяцами, необычно крупные траты, регулярные платежи, которые стоит внести в план, и подсказки, где сэкономить.</li><li>«Выгрузить для анализа» даёт текст со всеми тратами. Его можно вставить в чат с Claude и попросить разобрать.</li></ul><p>В «Истории» есть поиск по заметке, категории или сумме и фильтр по сумме. Пока поиск включён, ищется по всем месяцам. В открытой записи есть кнопка «Повторить сегодня». В «Анализе» → «Таблица (CSV)» можно скачать записи за любой период для Excel или Google Таблиц. У копилки можно задать цель: покажу процент, остаток и когда наберётся при нынешнем темпе.</p></div></details><details><summary>Как поставить на главный экран</summary><div class="hb"><p><b>Android, Google Chrome:</b></p><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px"><li>Открой ссылку на приложение именно в Chrome. Если открыла из Телеграма, нажми ⋮ вверху справа → «Открыть в Chrome».</li><li>Нажми ⋮ (три точки) в правом верхнем углу Chrome.</li><li>Выбери «Установить приложение». Если такого пункта нет, выбери «Добавить на главный экран», а затем «Установить».</li><li>Подтверди. На главном экране появится фиолетовый значок «считалОчка».</li><li>Дальше открывай только через значок. Приложение откроется без адресной строки и будет работать даже без интернета.</li></ol><p><b>iPhone, Safari:</b> кнопка «Поделиться» (квадрат со стрелкой) → «На экран «Домой»» → «Добавить».</p><p class="fine">Записи живут в браузере, через который приложение установлено. Если удалить значок через «Удалить приложение» или очистить данные Chrome, записи сотрутся, поэтому делай копии (раздел ниже).</p></div></details><details><summary>Перенести данные из другого приложения</summary><div class="hb"><p><b>Из другой считалОчки</b> (файла или старой ссылки):</p><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px"><li>Открой старую считалОчку, там шестерёнка → «Сохранить файл». Сохрани или отправь себе в «Избранное» в Телеграме.</li><li>Открой эту считалОчку → шестерёнка → «Восстановить из файла» и выбери сохранённый файл.</li><li>Всё переедет целиком: записи, копилки, платежи, монстрик. То, что было здесь до этого, заменится.</li></ol><p>Если «Сохранить файл» не срабатывает, нажми там «Копировать текст», а здесь вставь его в поле «Или из текста» и нажми «Восстановить».</p><p><b>Из другого приложения для учёта трат или из банка:</b></p><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px"><li>Выгрузи данные из того приложения (обычно «Экспорт» в настройках, файл CSV или Excel) или скачай выписку в банке.</li><li>Скопируй запрос ниже и отправь его Claude вместе с этим файлом.</li><li>Claude вернёт текст или файл. Здесь: шестерёнка → «Добавить записи из текста» → выбери файл или вставь текст → «Добавить».</li><li>Записи допишутся к текущим, ничего не сотрётся. Если загрузить то же самое ещё раз, дублей не будет.</li></ol><textarea id="h_prompt" readonly style="width:100%;min-height:90px;font-size:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:10px">Сделай из этих данных записи для приложения считалОчка. Ответь только JSON-списком, без пояснений. Каждая запись: {&quot;id&quot;: уникальная строка, &quot;type&quot;: &quot;e&quot; для расхода или &quot;i&quot; для дохода, &quot;amt&quot;: сумма числом больше нуля, &quot;cat&quot;: категория, &quot;date&quot;: дата в виде ГГГГ-ММ-ДД, &quot;note&quot;: короткое описание}. Категории расходов: prod продукты, cafe кафе и доставка, trans транспорт, taxi такси, rent жильё, kom коммуналка, conn связь, subs подписки, health здоровье, pharm аптека, beauty красота, cloth одежда, tech техника, fun развлечения, gift подарки, edu образование, trip путешествия, sport спорт, home дом и быт, pets питомцы, debt долги, tax налоги, save накопления, help помощь близким, other прочее. Категории доходов: salary зарплата, side подработка, gift_in подарок, refund возврат, other_in прочее. Переводы между своими счетами не включай. Если файл большой, сохрани результат в файл .json.</textarea><button type="button" class="btn sm" data-a="copyPrompt">Скопировать запрос для Claude</button></div></details><details><summary>Простой и полный режим</summary><div class="hb"><p><b>Простой</b> (включён сразу) — записываешь траты, видишь, сколько потрачено и укладываешься ли в план. Этого хватает большинству.</p><p><b>Полный</b> — для тех, кто хочет планировать деньги от зарплаты до зарплаты. Включается в шестерёнке → «Режим». Что добавляется:</p><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px"><li><b>Вкладка «Платежи».</b> Заносишь зарплату и аванс с днями, когда они приходят, и обязательные платежи: квартира, связь, кредит. В нужный день приложение напомнит, а ты отметишь «пришло» или «оплачено».</li><li><b>«Доступно в день».</b> Сколько можно тратить каждый день до следующей зарплаты, если вычесть платежи, которые нужно оплатить до неё. Если при нынешних тратах денег может не хватить, на главной появится предупреждение с датой. Там же — «Ближайшее»: платежи и доходы на месяц вперёд.</li><li><b>Раскладка зарплаты.</b> Правила вида «10-го откладывать 5 000 ₽ в Отпуск». В день выплаты приложение предложит разложить деньги по копилкам одной кнопкой.</li><li><b>Тип траты.</b> При записи можно отметить: обязательная, осознанная или импульсивная. На главной появится «Финансовое здоровье» — какая доля трат импульсивная, и челлендж «7 дней без импульсивных трат».</li></ol><p>Переключаться можно в любой момент, данные не теряются.</p></div></details><details><summary>Чтобы данные не пропали</summary><div class="hb"><ul><li>Записи хранятся только у тебя в телефоне, в этом браузере. На сайт они не отправляются, их никто, кроме тебя, не видит.</li><li>Открывай приложение всегда одним способом: значком на экране или в том же браузере. В другом браузере или на другом телефоне оно будет пустым.</li><li>Если очистить данные браузера или удалить приложение, записи сотрутся.</li><li>Раз в неделю делай копию: шестерёнка → «Сохранить файл» и отправь его себе в «Избранное». Восстановить можно там же, в том числе на новом телефоне.</li></ul></div></details></div><button type="button" class="btn ghost" data-a="close">Закрыть</button>')}

   '<div class="help f" style="gap:8px">'+
   det('Синхронизация: Яндекс Диск'+(ydOn()?' ✅':''),'<div id="yd_box">'+ydPanel()+'</div>')+
   det('Копии в Телеграм'+(tgOn?' ✅':''),'<div class="tgbk-box">'+(window.TGBK?TGBK.panel():'<p class="fine">Не загрузилось. Открой приложение с интернетом.</p>')+'</div>')+
   det('Резервная копия',

      try{await COL.doc(id).set({j:p[id]})}catch(e){if(prev===undefined)delete known[id];else known[id]=prev;throw e}
    }
    syncState='ok';
  }catch(e){syncState=(e&&e.code==='invalid_argument')?'ro':'err'}
  pushing=false;renderBadge();
}
function applyRemote(snap){
  var docs={};snap.docs.forEach(function(d){var x=d.data();if(x&&typeof x.j==='string')docs[d.id]=x.j});
  var ids=Object.keys(docs);
  if(!ids.length){
    if(snap.metadata&&snap.metadata.fromCache)return;
    if(!initDone){initDone=true;push()}
    return;
  }
  var changed=ids.some(function(id){return known[id]!==docs[id]});
  var first=!initDone;initDone=true;
  if(!changed||pushing){if(first){syncState='ok';renderBadge()}return}
  try{
    var cfg=docs.cfg?JSON.parse(docs.cfg):null,ents=[];
    ids.forEach(function(id){if(id.slice(0,2)==='e_')ents=ents.concat(JSON.parse(docs[id]))});
    if(!cfg)return;
    if(first){try{localStorage.setItem(KEY+'-pre-sync',JSON.stringify(S))}catch(e){}}
    cfg.entries=ents;
    S=migrate(cfg);known={};ids.forEach(function(id){known[id]=docs[id]});
    saveLocal();syncState='ok';
    if(sh)pendingR=true;else render();
  }catch(e){syncState='err'}
  renderBadge();
}


/* ---------- синхронизация через Яндекс Диск ----------
   Данные лежат у самого пользователя: «Приложения/считалОчка» на его Диске.
   Приложение видит только эту папку. Один файл schitalochka.json + копии по дням (последние 14). */
var YD={cid:'7e1b24adf33f4365ba5fb9ab37619532',redir:'https://sofaleya.github.io/schitalochka/',
  api:'https://cloud-api.yandex.net/v1/disk/resources',file:'app:/schitalochka.json',dir:'app:/Копии',
  key:'yd-sync',st:'off',msg:'',busy:false,again:false,t:null};
function ydGet(){try{return JSON.parse(localStorage.getItem(YD.key)||'{}')||{}}catch(e){return {}}}
function ydSet(p){var m=ydGet();Object.keys(p).forEach(function(k){if(p[k]===undefined)delete m[k];else m[k]=p[k]});try{localStorage.setItem(YD.key,JSON.stringify(m))}catch(e){}return m}
function ydOn(){return !!ydGet().tok}
function ydDirty(m){m=m||ydGet();return (m.chg||0)>(m.sent||0)}
// ответ Яндекса после входа приходит в адресе страницы (#access_token=…)
(function(){var h=location.hash||'';if(h.indexOf('access_token=')<0&&h.indexOf('error=')<0)return;
  var q=new URLSearchParams(h.slice(1));try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(q.get('access_token')){var m=ydGet();ydSet({tok:q.get('access_token'),exp:Date.now()+(+q.get('expires_in')||31536000)*1000,dev:m.dev||uid()});YD.justIn=true}
  else YD.msg='Яндекс не дал доступ'+(q.get('error')==='access_denied'?': вход отменён':' ('+(q.get('error_description')||q.get('error'))+')');})();
function ydLogin(){location.href='https://oauth.yandex.ru/authorize?response_type=token&client_id='+YD.cid+'&redirect_uri='+encodeURIComponent(YD.redir)}
function ydErr(e){if(e&&e.code)return e.code==='bad'?'файл в Диске повреждён':'код '+e.code;
  return 'нет связи с Яндексом'+(e&&e.message?' ('+e.message+')':'')}
function ydReq(method,url){var o={method:method,headers:{Authorization:'OAuth '+ydGet().tok}};
  return fetch(url,o).then(function(r){if(r.status===401){ydSet({tok:undefined,mod:undefined});YD.msg='Вход в Яндекс устарел, войди заново';throw {code:401}}return r})}
function ydOk(r){if(!r.ok)throw {code:r.status};return r}
function ydMeta(path){return ydReq('GET',YD.api+'?fields=modified,name,path&path='+encodeURIComponent(path||YD.file)).then(function(r){if(r.status===404)return null;return ydOk(r).json()})}
function ydDownload(){return ydReq('GET',YD.api+'/download?path='+encodeURIComponent(YD.file)).then(function(r){return ydOk(r).json()})
  .then(function(j){return fetch(j.href,{credentials:'omit',referrerPolicy:'no-referrer'})}).then(function(r){return ydOk(r).text()}).then(function(t){try{return JSON.parse(t)}catch(e){throw {code:'bad'}}})}
function ydUpload(path,text){return ydReq('GET',YD.api+'/upload?overwrite=true&path='+encodeURIComponent(path)).then(function(r){return ydOk(r).json()})
  .then(function(j){return fetch(j.href,{method:'PUT',body:new Blob([text],{type:'application/json'})})}).then(ydOk)}
function ydDir(){return ydReq('PUT',YD.api+'?path='+encodeURIComponent(YD.dir)).then(function(r){if(r.status!==409)ydOk(r)})}
async function ydDaily(day){ // копия дня + чистка старше 14 копий
  await ydDir();
  await ydReq('POST',YD.api+'/copy?overwrite=true&from='+encodeURIComponent(YD.file)+'&path='+encodeURIComponent(YD.dir+'/schitalochka-'+day+'.json')).then(ydOk);
  var r=await ydReq('GET',YD.api+'?limit=200&sort=name&fields=_embedded.items.name,_embedded.items.path&path='+encodeURIComponent(YD.dir)).then(function(r){return ydOk(r).json()});
  var it=((r._embedded&&r._embedded.items)||[]).filter(function(x){return /^schitalochka-\d{4}-\d\d-\d\d\.json$/.test(x.name)});
  for(var i=0;i<it.length-14;i++){try{await ydReq('DELETE',YD.api+'?permanently=true&path='+encodeURIComponent(it[i].path))}catch(e){}}
}
function ydPack(){return JSON.stringify({v:1,app:'schitalochka',savedAt:Date.now(),dev:ydGet().dev,data:S})}
function ydEmpty(){return S.demo||!realCount()}
function ydAdopt(r,mod){snapTake('pre',true);S=migrate(r.data);S.demo=false;saveLocal();syncCats();ydSet({mod:mod,sent:ydGet().chg||0});
  if(document.getElementById('ov')&&!document.getElementById('ov').hidden&&!document.getElementById('yd_box')){try{closeSheet()}catch(e){}}render()}
async function ydSync(){
  if(!ydOn())return;if(YD.busy){YD.again=true;return}
  YD.busy=true;YD.st='wait';ydBadge();
  try{
    var m=ydGet(),meta=await ydMeta();
    if(meta&&meta.modified!==m.mod){ // в Диске новая версия (с другого устройства или первое подключение)
      var r=await ydDownload();if(!r||!okBackup(r.data))throw {code:'bad'};
      var same=JSON.stringify(r.data)===JSON.stringify(S);
      if(same){ydSet({mod:meta.modified})}
      else if(!m.mod&&!ydEmpty()){ // первое подключение, и данные есть и тут, и в Диске
        var cnt=r.data.entries.filter(function(e){return !e.demo}).length;
        if(confirm('В Яндекс Диске уже есть данные считалОчки ('+cnt+' записей). Взять их на это устройство?\n\nОК - взять из Диска\nОтмена - оставить то, что на этом устройстве (версия из Диска сохранится в папке «Копии»)')){ydAdopt(r,meta.modified)}
        else{await ydDir();await ydUpload(YD.dir+'/до-подключения-'+iso(new Date())+'.json',JSON.stringify(r));ydSet({mod:meta.modified,chg:Date.now()})}
      }
      else if(m.mod&&ydDirty(m)&&!ydEmpty()){ // поменяли и тут, и на другом устройстве: оставляем эту версию, другую не теряем
        await ydDir();var nm='другое-устройство-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json';
        await ydUpload(YD.dir+'/'+nm,JSON.stringify(r));ydSet({mod:meta.modified});
        toast('Данные менялись и тут, и на другом устройстве. Оставила эти, другую версию сохранила в Диске: «Копии».',true);
      }
      else ydAdopt(r,meta.modified);
    }
    m=ydGet();
    if(!ydEmpty()&&(ydDirty(m)||!meta)){
      var day=iso(new Date());
      if(meta&&m.bk!==day){try{await ydDaily(day);ydSet({bk:day})}catch(e){if(e&&e.code===401)throw e}}
      var chg=m.chg||Date.now();await ydUpload(YD.file,ydPack());
      var nm2=await ydMeta();ydSet({mod:nm2&&nm2.modified,sent:chg,bk:ydGet().bk||day});
    }
    ydSet({at:Date.now()});YD.st='ok';YD.msg='';
  }catch(e){YD.st=ydOn()?'err':'off';if(!(e&&e.code===401))YD.msg=ydErr(e)}
  YD.busy=false;ydBadge();
  if(YD.again){YD.again=false;setTimeout(ydSync,300)}
}
function ydChanged(){if(!ydOn())return;ydSet({chg:Date.now()});clearTimeout(YD.t);YD.t=setTimeout(ydSync,2500)}
function ydLabel(){if(!ydOn())return '';return YD.st==='ok'?'Диск ✓':YD.st==='wait'?'синхронизация…':YD.st==='err'?'нет связи с Диском':''}
function ydPanel(){var m=ydGet(),h='';
  if(!m.tok){
    h='<p class="fine" style="margin:0">Данные будут лежать в твоём Яндекс Диске, в папке «Приложения/считалОчка», и сами появятся на другом телефоне или компьютере. Приложение видит только эту папку.</p>'+
      (YD.msg?'<p class="fine" style="margin:6px 0 0;color:var(--out)">'+esc(YD.msg)+'</p>':'')+
      '<div class="btns" style="margin-top:8px"><button type="button" class="btn sm" data-a="ydIn">Войти через Яндекс</button></div>';

    h='<p class="fine" style="margin:0">'+(YD.st==='wait'?'Синхронизирую…':YD.st==='err'?'<span style="color:var(--out)">Не получилось: '+esc(YD.msg)+'</span>':'Подключено'+(at?'. Последняя синхронизация: '+(iso(at)===iso(new Date())?'сегодня':dlabel(iso(at)))+' в '+p2(at.getHours())+':'+p2(at.getMinutes()):''))+'</p>'+
      '<p class="fine" style="margin:4px 0 0">Копии за последние 14 дней лежат там же, в папке «Копии».</p>'+
      '<div class="btns" style="margin-top:8px"><button type="button" class="btn ghost sm" data-a="ydNow">Синхронизировать сейчас</button><button type="button" class="btn ghost sm" data-a="ydOut">Отключить</button></div>';
  }
  return h}
function ydBadge(){renderBadge();var b=document.getElementById('yd_box');if(b)b.innerHTML=ydPanel()}
function ydOut(){if(!confirm('Отключить Яндекс Диск на этом устройстве? Данные останутся и тут, и в Диске.'))return;
  var d=ydGet().dev;try{localStorage.removeItem(YD.key)}catch(e){}ydSet({dev:d});YD.st='off';YD.msg='';ydBadge()}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&ydOn())setTimeout(ydSync,800)});
window.addEventListener('storage',function(e){if(e.key===YD.key){var was=YD.st==='off';if(ydOn()&&was)ydSync();else ydBadge()}});
if(ydOn()){YD.st='wait';setTimeout(function(){ydSync();if(YD.justIn)toast('Яндекс Диск подключён')},600)}

if(!S.onb&&(realCount()>0||S.accounts.length>1||S.pet)){S.onb=1;saveLocal()}
