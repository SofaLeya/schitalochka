name: Сборка apk

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Достать ключ подписи
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Нет секрета SIGNING_KEY - добавь его в Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Собрать apk
        working-directory: android
        env:
          SIGNING_STORE: ${{ runner.temp }}/release.jks
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Переименовать
        run: cp android/app/build/outputs/apk/release/app-release.apk schitalochka.apk

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: считалОчка для Android
          body: |
            Скачать на телефон: https://github.com/sofaleya/schitalochka/releases/latest/download/schitalochka.apk
            Сборка №${{ github.run_number }}
          make_latest: true
          files: schitalochka.apk
