name: Тесты и выкладка сайта

on:
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - '*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  # Сайт выкладывается только если все тесты зелёные
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Собрать папку сайта
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'android' --exclude 'tests' \
            --exclude 'node_modules' --exclude '_site' --exclude 'package.json' --exclude 'package-lock.json' \
            --exclude 'playwright.config.js' --exclude 'README.md' --exclude '.gitignore' ./ _site/
          ls _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
