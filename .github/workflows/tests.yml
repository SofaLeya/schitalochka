name: Тесты и выкладка сайта

on:
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - '*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      # на раннере GitHub уже стоит Google Chrome - тесты идут в нём, ничего не скачиваем (это было самое долгое)
      - name: Браузер для тестов
        run: |
          if [ -x /usr/bin/google-chrome ]; then echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else npx playwright install --with-deps chromium; fi
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  # Сайт выкладывается только если все тесты зелёные
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Собрать папку сайта
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'android' --exclude 'tests' \
            --exclude 'node_modules' --exclude '_site' --exclude 'package.json' --exclude 'package-lock.json' \
            --exclude 'playwright.config.js' --exclude 'README.md' --exclude '.gitignore' ./ _site/
          # номер сборки - чтобы открытое приложение заметило новую версию и предложило обновиться
          V=${GITHUB_SHA::7}
          sed -i "s/var BUILD='__BUILD__'/var BUILD='$V'/" _site/index.html
          echo "$V" > _site/version.txt
          ls _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # Новое имя артефакта для каждого запуска и попытки: повторные запуски не конфликтуют
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      # Wait until the REST API sees the uploaded artifact before Pages looks it up.
      - name: Дождаться доступности архива
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for i in $(seq 1 30); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq '.artifacts[] | select(.expired == false) | .name' | grep -Fxq "$ARTIFACT_NAME"; then
              echo "Pages artifact is available"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact did not become visible in the API"
          exit 1

      - name: Дождаться синхронизации Pages
        run: sleep 10
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Пауза перед повторной публикацией
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Пауза перед последней попыткой
        if: steps.deployment_retry.outcome == 'failure'
        run: sleep 30
      - id: deployment_final
        if: steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
